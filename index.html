        {l:'抓包"只有令牌没有应答"',leaf:'<b>指向：设备未就绪。</b>检查复位/SETUP 中断链（U15 五事件）、EP0 初始化（U26 特征表）。'},
        {l:'抓包"描述符内容异常"',leaf:'<b>指向：描述符数据错误。</b>核对 bLength/类型码/bMaxPacketSize0（U25 红线，U12）。'}
      ]},
      {l:'卡在 SET_ADDRESS 之后',leaf:'<b>检查：</b>地址是否在 Status 后 2 ms 生效（U12 ✅）；固件是否还响应旧地址。'},
      {l:'卡在 SET_CONFIGURATION',leaf:'<b>检查：</b>配置/接口/端点描述符与固件端点初始化是否一致（U25 红线 2）。'}
    ]},
    {l:'枚举成功但速率低于预期',ch:[
      {l:'HS 设备只跑到 FS',leaf:'<b>指向：chirp 握手失败（U07/U08 ✅）。</b>检查时钟精度、布线、收发器；或插在了 USB2 口/hub 上（U23）。'},
      {l:'SS 设备跑到 USB2',leaf:'<b>指向：SS 通路训练失败（SS.Disabled 回退，U16/U23 ✓）。</b>检查 SS 触点连通性、线缆、hub 代际。'}
    ]},
    {l:'工作中出错（传输错误/掉线）',ch:[
      {l:'抓包大量 CRC 错（静默丢包）',leaf:'<b>指向：信号完整性。</b>布线/接地/线缆质量（U10/U26/U27）；不是固件逻辑问题。'},
      {l:'抓包只有挂起事件',leaf:'<b>指向：电源策略。</b>远程唤醒实现与系统电源设置（U26 案例、U08 挂起规则）。'},
      {l:'传输超时/吞吐骤降',leaf:'<b>检查：</b>NAK 比例（固件供数能力，U15 双缓冲）、调度预算（U14）、主机侧负载。'}
    ]}
  ]};
  el.innerHTML='<div class="w-toolbar"><span class="title">交互式故障树（点击逐层下钻）</span><button class="ctl" data-a="reset">回到症状层</button></div><div class="w-body" data-a="tree"></div>';
  var open={};
  function render(){
    var h='<div class="lrow sel"><span><b>'+TREE.q+'</b></span></div>';
    (function walk(node,depth,path){
      node.ch.forEach(function(c,i){
        var key=path+'-'+i;
        if(c.leaf){ h+='<div class="linfo" style="margin:4px 0 8px '+depth*22+'px"><b>'+c.l+'</b><br>'+c.leaf+'</div>'; return; }
        var isOpen=!!open[key];
        h+='<div class="lrow'+(isOpen?' sel':'')+'" data-open="'+key+'" style="margin-left:'+depth*22+'px;cursor:pointer"><span>'+c.l+'</span><span class="ln">'+(isOpen?'▾':'▸')+'</span></div>';
        if(isOpen&&c.ch) walk(c,depth+1,key);
      });
    })(TREE,0,'');
    $('[data-a="tree"]',el).innerHTML=h;
    $all('[data-open]',el).forEach(function(r){
      r.addEventListener('click',function(){ var k=r.getAttribute('data-open'); open[k]=!open[k]; render(); });
    });
  }
  el.addEventListener('click',function(ev){ var b=ev.target.closest('[data-a="reset"]'); if(b){ open={}; render(); } });
  render();
};

/* --- U28 枚举实验台 --- */
WIDGETS['enumLab']=function(el){
  el.innerHTML='<div class="w-toolbar"><span class="title">USB 2.0 枚举实验台</span>'+
   '<select class="ctl" data-a="fault"><option value="none">正常</option><option value="len">注入：bMaxPacketSize0 非法</option><option value="stall">注入：GET_DESCRIPTOR 回 STALL</option><option value="timeout">注入：固件不应答</option><option value="speed">注入：HS chirp 失败</option></select>'+
   '<button class="ctl" data-a="play">▶ 播放</button><button class="ctl" data-a="step">单步 ▸</button><button class="ctl" data-a="reset">重置</button></div>'+
   '<div class="w-body"><div data-a="host"></div><div class="linfo" data-a="log" style="min-height:120px"></div>'+
   '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><div class="linfo" style="flex:1;min-width:280px" data-a="detail"></div><div class="linfo" style="flex:1;min-width:240px;background:var(--warn-soft);border-color:var(--warn-soft)" data-a="free"></div></div></div>';
  function buildMsgs(fault){
    var M=[
     {f:0,l:'复位（SE0 ≥10ms）',c:'设备进入 Default 态（地址 0）。',d:'复位信令：SE0 ≥10 ms（TDRST，印 153 ✅）。'+(fault==='speed'?'<b>【注入】</b>chirp 握手失败 → 设备回退 FS（U07/U08 已核 ✅）——枚举继续，速率降为 12 Mb/s。':''),fr:'<b>规范规定：</b>复位时长与设备状态机。<b>主机自由度：</b>复位重试策略。'},
     {f:0,l:'SETUP: GET_DESCRIPTOR(Device) wLength=8',c:'主机先取 bMaxPacketSize0。',d:'Setup 包恒用 DATA0（印 225 ✅）；8 字节请求的依据见 U12。'+(fault==='timeout'?'<b>【注入】</b>设备不响应 → 主机超时重试 ×N 后放弃（对应 U26 特征"只有令牌没有应答"）。':''),fr:'<b>规范规定：</b>请求语义。<b>主机自由度：</b>是否分两次读（8→18）。'},
     {f:0,l:'DATA1: 描述符前 8 字节',c:'bMaxPacketSize0 就在第 8 字节。',d:(fault==='len'?'<b>【注入】</b>设备声明 bMaxPacketSize0=255——规范只允许 8/16/32/64 → 主机判异常（U25 红线 1）。':'示例值 0x40=64（合法）。'),fr:'<b>规范规定：</b>bMaxPacketSize0 合法值。<b>主机自由度：</b>无（这是硬约束）。'},
     {f:0,l:'SETUP: SET_ADDRESS(0x2A)',c:'分配唯一地址。',d:'SET_ADDRESS 语义（§9.4.5）。',fr:'<b>规范规定：</b>地址在 Status 后生效 + 2 ms 恢复（印 246 ✅）。<b>主机自由度：</b>分配哪个地址值。'},
     {f:1,l:'状态完成（2 ms 恢复）',c:'设备切换地址，不再响应 0。',d:'U12 已核 ✅。',fr:'<b>规范规定：</b>2 ms 恢复窗口。<b>主机自由度：</b>等待多久才开始用新地址（≥2 ms）。'},
     {f:0,l:'GET_DESCRIPTOR(Device) wLength=18',c:'用新地址读完整描述符。',d:'地址域=0x2A。',fr:'<b>主机自由度：</b>一次读完或分包读。'},
     {f:1,l:'DATA0/DATA1: 18 字节',c:'VID/PID/类码/配置数……',d:'分包受 bMaxPacketSize0 约束（U13）。'+(fault==='stall'?'<b>【注入】</b>设备对 GET_DESCRIPTOR 回 STALL → 主机重试后放弃（U13 异常路径）：标准请求不能不答。':''),fr:'<b>规范规定：</b>描述符结构与长度。<b>主机自由度：</b>读取时机。'},
     {f:0,l:'GET_DESCRIPTOR(Configuration) ×2',c:'先探 9 字节再读全量（主机策略）。',d:'wTotalLength 在前 9 字节里（U12 描述符树）。',fr:'<b>主机自由度：</b>"先探后读"或直接读全量——固件两种都兼容。'},
     {f:1,l:'DATA: 配置+接口+端点整棵子树',c:'端点资源在此声明。',d:'端点描述符 ↔ 固件端点初始化必须一致（U25 红线 2）。',fr:'<b>规范规定：</b>描述符层级与字段。<b>主机自由度：</b>是否读取字符串描述符。'},
     {f:0,l:'SETUP: SET_CONFIGURATION(1)',c:'配置生效。',d:'§9.4.7。',fr:'<b>规范规定：</b>配置语义。<b>主机自由度：</b>选哪个配置值。'},
     {f:1,l:'状态完成 → Configured',c:'功能端点可用，枚举完成。',d:'此后主机加载类驱动（U28 自由度表）。',fr:'<b>规范规定：</b>状态机迁移（图 9-1 ✅）。<b>主机自由度：</b>何时加载驱动。'}
    ];
    if(fault==='none'||fault==='speed'){} // 全流程
    if(fault==='len'||fault==='stall'||fault==='timeout'){
      // 在第 3 步后追加中止
      M.splice(3, M.length-3, {f:0,l:'枚举中止',c:'主机放弃该设备。',d:'对照正常流程的后续步骤（切换到"正常"可看全 11 步）。',fr:'<b>定位提示：</b>'+(fault==='len'?'描述符合法性（U25 红线）。':(fault==='stall'?'EP0 分发器完整性（U13）。':'事件链与时钟（U24/U15）。'))});
    }
    return M;
  }
  var P=null, cur=[];
  function build(){
    var fault=$('[data-a="fault"]',el).value;
    cur=buildMsgs(fault);
    P=lanePlayer($('[data-a="host"]',el), {lanes:['主机','设备'],msgs:cur.map(function(m){return {f:m.f,label:m.l,cap:m.c};})});
    var orig=P.show;
    P.show=function(i){
      orig(i);
      var h=''; cur.slice(0,i+1).forEach(function(m,j){ h+='<div style="margin:4px 0;'+(j===i?'font-weight:600':'color:var(--muted)')+'">第 '+(j+1)+' 步：'+m.l+'</div>'; });
      $('[data-a="log"]',el).innerHTML=h;
      $('[data-a="detail"]',el).innerHTML='<b>协议解读：</b>'+cur[i].d;
      $('[data-a="free"]',el).innerHTML=cur[i].fr;
    };
    setPlaceholder();
  }
  function setPlaceholder(){
    $('[data-a="log"]',el).innerHTML='<span class="w-note">点击"播放/单步"后，此处按顺序列出已走过的步骤。</span>';
    $('[data-a="detail"]',el).innerHTML='<span class="w-note">当前步骤的包级协议解读。</span>';
    $('[data-a="free"]',el).innerHTML='<span class="w-note">当前步骤"规范规定 vs 主机自由度"标注。</span>';
  }
  $('[data-a="fault"]',el).addEventListener('change',build);
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a="play"],[data-a="step"],[data-a="reset"]'); if(!b||!P) return;
    var a=b.getAttribute('data-a');
    if(a==='play'){ if(P.timer){ clearInterval(P.timer); P.timer=null; b.textContent='▶ 播放'; return; }
      if(P.idx>=cur.length-1) P.idx=-1; b.textContent='⏸ 暂停'; P.show(P.idx+1);
      P.timer=setInterval(function(){ if(P.idx>=cur.length-1){ clearInterval(P.timer); P.timer=null; b.textContent='▶ 播放'; return; } P.show(P.idx+1); },1600);
    } else if(a==='step'){ if(P.timer){ clearInterval(P.timer); P.timer=null; var pb=el.querySelector('[data-a="play"]'); if(pb) pb.textContent='▶ 播放'; }
      if(P.idx>=cur.length-1) P.idx=-1; P.show(P.idx+1);
    } else if(a==='reset'){ if(P.timer){ clearInterval(P.timer); P.timer=null; } P.idx=-1; P.reset(); setPlaceholder(); }
  });
  build();
};

/* --- U29 SS 链路实验台 --- */
WIDGETS['ssLab']=function(el){
  var STEPS=[
   {cap:'① 插入：Rx.Detect 检测到对端接收端接（对照 USB2 的上拉检测——机制同源、电气不同）。',tag:'§7.5.3 ✅'},
   {cap:'② Polling.LFPS：双方交换 LFPS 突发，确认 SS 能力（印 169 ✅）。',tag:'§7.5.4.3'},
   {cap:'③ Polling.Active：TS1 有序集收发；收到 8 个连续相同 TS1/TS2 → 转 Polling.Configuration（印 181 原文 ✅）。',tag:'§7.5.4.8.2'},
   {cap:'④ Polling.Configuration：交换 TS2；收 8 发 16 → 转 Polling.Idle（印 183 ✅）；12 ms 超时 → Rx.Detect/eSS.Disabled（印 184 ✅）。',tag:'§7.5.4.9'},
   {cap:'⑤ 进入 U0：链路全速活动。',tag:'§7.5.6'},
   {cap:'⑥ credit 通告：交换 Header Sequence Number 与 Rx Header Buffer Credit（印 128 原文 ✅）——没有它不能发头包。',tag:'§7.2.4.1.1'},
   {cap:'⑦ 突发传输：ACK TP（NumP）→ 连续 DP（1024 B）→ 逐包确认（中文文档 §8.12 已核 ✓）；在途量受 NumP×credit 双重约束。',tag:'§7.2.4/§8.12'},
   {cap:'⑧ 错误发生：序列错误 → 进 Recovery（印 156 错误恢复表 ✅）。',tag:'Recovery'},
   {cap:'⑨ Recovery：重新训练参数（Active/Configuration/Idle 子状态，§7.5.10 ✅）→ 回 U0；链路参数未丢所以比重新 Polling 快得多。',tag:'§7.5.10'},
   {cap:'⑩ 对照小结：两代"连接→协商→数据→恢复"四段式同构、机制异构（U22）；SS 的恢复不丢 credit 状态，USB2 的重试逐事务进行。',tag:'U22 矩阵'}
  ];
  el.innerHTML='<div class="w-toolbar"><span class="title">SS 链路实验台（单步回放，全部标注依据）</span><button class="ctl" data-a="play">▶ 播放</button><button class="ctl" data-a="step">单步 ▸</button><button class="ctl" data-a="reset">重置</button></div>'+
   '<div class="w-body"><div class="linfo" data-a="log" style="min-height:200px"></div></div>';
  var log=$('[data-a="log"]',el);
  mkStepPlayer(el,{title:'',interval:1900,noTemplate:true,steps:STEPS,capIn:function(){return {innerHTML:''};},
    render:function(p,s,i){
      var h=''; STEPS.slice(0,i+1).forEach(function(x,j){ h+='<div style="margin:6px 0;'+(j===i?'font-weight:600':'color:var(--muted)')+'">'+x.cap+' <span class="mono" style="font-size:10.5px">['+x.tag+']</span></div>'; });
      log.innerHTML=h;
    },
    onReset:function(){ log.innerHTML='<div style="color:var(--muted)">点击"播放/单步"开始。每步右下标注规范依据。</div>'; }
  });
};

/* --- U30 知识地图 --- */
WIDGETS['knowledgeMap']=function(el){
  function drawMap(){
    var h='<div style="display:flex;gap:10px;flex-wrap:wrap">';
    STAGES.forEach(function(st){
      h+='<div style="flex:1;min-width:96px"><div style="font-size:11px;color:var(--muted);margin-bottom:6px">'+st.name.split('·')[0]+'</div>';
      st.units.forEach(function(uid){
        var m=META[uid];
        var bg=m.ready?(state.done[uid]?'var(--ok)':'var(--accent)'):'var(--chip-bg)';
        var fg=m.ready?'#fff':'var(--muted)';
        h+='<div data-u="'+uid+'" title="'+esc(m.t)+'" style="cursor:pointer;background:'+bg+';color:'+fg+';border-radius:8px;padding:4px 6px;margin:3px 0;font-size:11px;text-align:center">'+String(uid).padStart(2,'0')+'</div>';
      });
      h+='</div>';
    });
    h+='</div><div class="legend" style="margin-top:8px"><span><span class="sw" style="background:var(--ok)"></span>已完成</span><span><span class="sw" style="background:var(--accent)"></span>未完成</span><span><span class="sw" style="background:var(--chip-bg);border:1px solid var(--border)"></span>规划中</span></div>';
    el.innerHTML='<div class="w-toolbar"><span class="title">知识地图（点击节点跳转单元）</span></div><div class="w-body">'+h+'</div>';
    $all('[data-u]',el).forEach(function(n){
      n.addEventListener('click',function(){ render(parseInt(n.getAttribute('data-u'),10)); });
    });
  }
  drawMap();
};

/* --- U30 模块抽测 --- */
WIDGETS['moduleExam']=function(el){
  var MODULES={'基础': [1,2,4],'速率与调度':[3,14],'包与编码':[9,10],'传输与枚举':[11,12,13],'SS 链路与协议':[16,18,19,20],'电源与对比':[21,22,23],'固件与故障':[15,24,25,26,27]};
  var cur=null, qs=[];
  el.innerHTML='<div class="w-toolbar"><span class="title">综合抽测（每轮 5 题）</span><select class="ctl" data-a="mod"></select><button class="ctl" data-a="new">出卷</button><button class="ctl" data-a="grade">交卷</button><span class="w-note" data-a="res"></span></div>'+
   '<div class="w-body" data-a="paper"></div>';
  var sel=el.querySelector('[data-a="mod"]');
  Object.keys(MODULES).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o); });
  function build(){
    var pool=[];
    MODULES[sel.value].forEach(function(u){ (UNIT_CONTENT[u]&&UNIT_CONTENT[u].quiz||[]).forEach(function(q){ pool.push({u:u,q:q}); }); });
    qs=[];
    var idxs=pool.map(function(_,i){return i;});
    for(var i=idxs.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=idxs[i]; idxs[i]=idxs[j]; idxs[j]=t; }
    idxs.slice(0,5).forEach(function(pi){ qs.push(pool[pi]); });
    var h='';
    qs.forEach(function(it,qi){
      h+='<div class="q-item" data-qi="'+qi+'"><div class="q-title"><span class="qno">Q'+(qi+1)+'</span>（U'+String(it.u).padStart(2,'0')+'）'+it.q.q+'</div>';
      it.q.opts.forEach(function(op,oi){ h+='<label class="opt"><input type="'+(it.q.multi?'checkbox':'radio')+'" name="mq'+qi+'" value="'+oi+'">'+esc(op)+'</label>'; });
      h+='</div>';
    });
    el.querySelector('[data-a="paper"]').innerHTML=h;
    el.querySelector('[data-a="res"]').textContent='';
  }
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a]'); if(!b) return;
    var a=b.getAttribute('data-a');
    if(a==='new'){ build(); return; }
    if(a==='grade'){
      if(!qs.length){ el.querySelector('[data-a="res"]').textContent='先出卷。'; return; }
      var score=0;
      qs.forEach(function(it,qi){
        var picked=Array.prototype.slice.call(el.querySelectorAll('input[name="mq'+qi+'"]:checked')).map(function(i){return parseInt(i.value,10);}).sort();
        var key=it.q.a.slice().sort();
        var ok=picked.length===key.length&&picked.every(function(v,i){return v===key[i];});
        if(ok) score++; else {
          state.wrong[it.u]=state.wrong[it.u]||[];
          var qIndex=UNIT_CONTENT[it.u].quiz.indexOf(it.q);
          if(qIndex>=0&&state.wrong[it.u].indexOf(qIndex)<0) state.wrong[it.u].push(qIndex);
        }
      });
      store('wrong',state.wrong);
      el.querySelector('[data-a="res"]').textContent='得分：'+score+' / '+qs.length+'（错题已记入对应单元）';
    }
  });
  build();
};

/* --- U30 错题回顾 --- */
WIDGETS['wrongReview']=function(el){
  function render(){
    var keys=Object.keys(state.wrong).filter(function(k){ return state.wrong[k]&&state.wrong[k].length&&UNIT_CONTENT[k]; });
    var h='';
    if(!keys.length){ h='<div class="callout ok" style="margin:0">目前没有错题记录——完成各单元测验后，错题会出现在这里。</div>'; }
    else {
      keys.sort(function(a,b){ return a-b; }).forEach(function(k){
        h+='<div class="lrow" data-u="'+k+'" style="cursor:pointer"><span><b>U'+String(k).padStart(2,'0')+'</b>　'+esc(META[k].t)+'<span class="ln">　错 '+state.wrong[k].length+' 题</span></span><span class="ln">去复习 ›</span></div>';
        state.wrong[k].forEach(function(qi){
          var q=UNIT_CONTENT[k].quiz[qi];
          if(q) h+='<div class="linfo" style="margin:2px 0 8px 24px">'+esc(q.q)+'<br><span style="color:var(--ok)">正确答案：'+q.a.map(function(i){return String.fromCharCode(65+i);}).join('、')+'</span></div>';
        });
      });
      h+='<div style="margin-top:8px"><button class="ctl" data-a="clear">清空错题记录</button></div>';
    }
    el.innerHTML='<div class="w-toolbar"><span class="title">错题回顾（保存在本浏览器）</span></div><div class="w-body">'+h+'</div>';
    $all('[data-u]',el).forEach(function(n){
      n.addEventListener('click',function(){ render(parseInt(n.getAttribute('data-u'),10)); });
    });
    var cb=el.querySelector('[data-a="clear"]');
    if(cb) cb.addEventListener('click',function(){ state.wrong={}; store('wrong',state.wrong); render(); });
  }
  render();
};
</script>
