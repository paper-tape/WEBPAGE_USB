<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USB 2.0 / USB 3.0 系统课程（交互式教程）</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --text:#1d2433; --muted:#5c6675; --border:#e2e6ee;
  --accent:#2456d6; --accent-soft:#e9eefc; --accent-line:#b9c9f5;
  --ok:#177a49; --ok-soft:#e2f5ea; --warn:#a05a00; --warn-soft:#fdf1de; --bad:#b3362a; --bad-soft:#fbe9e7;
  --code-bg:#eef1f7; --chip-bg:#eceff5; --shadow:0 1px 3px rgba(20,30,60,.08);
  --sidebar-bg:#fbfcfe;
}
html[data-theme="dark"]{
  --bg:#12151c; --panel:#1a1f2a; --text:#e5e9f2; --muted:#9aa4b5; --border:#2a3140;
  --accent:#7aa2ff; --accent-soft:#1c2a4a; --accent-line:#31456e;
  --ok:#43cf8d; --ok-soft:#12301f; --warn:#e9a63c; --warn-soft:#33270f; --bad:#ff7b6e; --bad-soft:#3a1a16;
  --code-bg:#222938; --chip-bg:#242b3a; --shadow:0 1px 3px rgba(0,0,0,.4);
  --sidebar-bg:#161b25;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;font-size:15.5px;line-height:1.78}
a{color:var(--accent)}
button{font-family:inherit}

/* ===== header ===== */
header.app{position:fixed;top:0;left:0;right:0;height:58px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50}
header.app .brand{font-weight:700;font-size:16px;white-space:nowrap}
header.app .brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);line-height:1.2}
.verchip{font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:2px 10px;white-space:nowrap}
.progress-wrap{display:flex;align-items:center;gap:8px;min-width:150px}
.progress-track{width:120px;height:8px;background:var(--chip-bg);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .3s}
.progress-label{font-size:12px;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.search-wrap{position:relative}
#searchInput{width:220px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13.5px}
#searchInput:focus{outline:2px solid var(--accent-line)}
#searchResults{position:absolute;top:38px;right:0;width:380px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);display:none;z-index:60}
#searchResults .sr-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
#searchResults .sr-item:hover{background:var(--accent-soft)}
#searchResults .sr-item b{color:var(--accent)}
#searchResults .sr-empty{padding:12px;color:var(--muted);font-size:13px}
.iconbtn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:14px}
.iconbtn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
#sideToggle{display:none}

/* ===== layout ===== */
nav.side{position:fixed;top:58px;left:0;bottom:0;width:296px;overflow-y:auto;background:var(--sidebar-bg);border-right:1px solid var(--border);padding:12px 10px 40px;z-index:40}
main.wrap{margin-left:296px;padding:78px 28px 60px}
@media (max-width:1080px){
  nav.side{transform:translateX(-100%);transition:transform .2s}
  body.sidenav nav.side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  main.wrap{margin-left:0}
  #sideToggle{display:inline-block}
}
.article{max-width:940px;margin:0 auto}
.stage-head{margin:18px 0 4px;font-size:12.5px;color:var(--muted);padding:6px 8px;border-bottom:1px dashed var(--border)}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:13.8px;color:var(--text);border:1px solid transparent}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}
.nav-item .st{font-size:12px;color:var(--muted);width:18px;text-align:center;flex:none}
.nav-item.done .st{color:var(--ok)}
.nav-item.locked{color:var(--muted)}
.nav-item .plan-tag{font-size:10.5px;color:var(--warn);border:1px solid var(--warn-soft);background:var(--warn-soft);border-radius:8px;padding:0 6px;margin-left:auto}

/* ===== content typography ===== */
.article h1{font-size:26px;margin:6px 0 4px;line-height:1.35}
.article .meta-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 18px;font-size:12.5px;color:var(--muted)}
.genchip{background:var(--chip-bg);border-radius:10px;padding:2px 10px;color:var(--muted)}
.sec{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin:0 0 18px;box-shadow:var(--shadow)}
.sec>h2{font-size:19px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sec h3{font-size:16px;margin:18px 0 8px}
.sec p{margin:8px 0}
.sec ul,.sec ol{margin:8px 0;padding-left:24px}
.sec li{margin:4px 0}
.mono,.code{font-family:Consolas,"Cascadia Mono",monospace;font-size:.92em;background:var(--code-bg);border-radius:4px;padding:1px 5px}
.tbl{width:100%;border-collapse:collapse;font-size:13.8px;margin:10px 0}
.tbl th,.tbl td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--chip-bg);font-weight:600}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--chip-bg) 40%,transparent)}
.callout{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0;font-size:14px}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.danger{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.term{border-bottom:1px dashed var(--accent);cursor:help;color:var(--accent)}
.term-pop{position:absolute;max-width:340px;background:var(--panel);border:1px solid var(--accent-line);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:80;display:none;line-height:1.6}
.term-pop b{color:var(--accent)}
.fig-note{font-size:12.5px;color:var(--muted);margin-top:6px}
.mis .row{display:flex;gap:10px;padding:9px 12px;border-radius:10px;margin:8px 0;font-size:14px;align-items:flex-start}
.mis .row .tag{flex:none;font-weight:700;font-size:12px;border-radius:8px;padding:1px 8px;margin-top:2px}
.mis .bad{background:var(--bad-soft)} .mis .bad .tag{color:#fff;background:var(--bad)}
.mis .good{background:var(--ok-soft)} .mis .good .tag{color:#fff;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:var(--chip-bg);border:1px solid var(--border);border-radius:10px;padding:3px 12px;font-size:13.5px}
.reflist{font-size:13.5px;color:var(--muted)}
.reflist li{margin:5px 0}
.vtag{font-size:11.5px;border-radius:8px;padding:0 6px;margin-left:6px;white-space:nowrap}
.v-yes{background:var(--ok-soft);color:var(--ok)}
.v-part{background:var(--warn-soft);color:var(--warn)}
.plan-note{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:16px 18px;margin:12px 0;font-size:14px}

/* ===== footer nav ===== */
.unit-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:6px 0 30px;flex-wrap:wrap}
.unit-foot .nav-btns{display:flex;gap:10px}
.btn{border:1px solid var(--accent-line);background:var(--accent);color:#fff;border-radius:9px;padding:8px 18px;font-size:14px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel);color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ===== quiz ===== */
.quiz .q-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0}
.quiz .q-title{font-weight:600;margin-bottom:8px}
.quiz .q-title .qno{color:var(--accent);margin-right:6px}
.quiz .opt{display:block;padding:7px 12px;border:1px solid var(--border);border-radius:9px;margin:6px 0;cursor:pointer;font-size:14px}
.quiz .opt:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.quiz .opt input{margin-right:8px}
.quiz .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.quiz .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.quiz .exp{display:none;margin-top:8px;border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.quiz .exp.show{display:block}
.quiz .result{margin-top:12px;font-weight:600}
.quiz .result.ok{color:var(--ok)} .quiz .result.no{color:var(--bad)}

/* ===== widgets ===== */
.widget{border:1px solid var(--border);border-radius:12px;margin:14px 0;overflow:hidden;background:var(--panel)}
.w-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--chip-bg);font-size:13px}
.w-toolbar .title{font-weight:600;margin-right:6px}
.w-body{padding:14px}
.w-cap{font-size:13px;color:var(--muted);padding:8px 14px 12px}
.werr{color:var(--bad);font-size:13px}
.ctl{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:7px;padding:4px 12px;font-size:13px;cursor:pointer}
.ctl:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.ctl.on{background:var(--accent);color:#fff;border-color:var(--accent)}
select.ctl{padding:4px 8px}
.w-note{font-size:12.5px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;margin-top:8px}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* layer stack */
.lstack{display:flex;flex-direction:column;gap:6px;max-width:420px}
.lrow{border:1px solid var(--border);border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center;background:var(--chip-bg)}
.lrow:hover{border-color:var(--accent-line)}
.lrow.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.lrow .ln{color:var(--muted);font-size:12px}
.linfo{border:1px solid var(--accent-line);border-radius:10px;padding:12px 14px;font-size:13.8px;min-height:130px;background:var(--accent-soft)}
.linfo b{color:var(--accent)}
/* trip animation */
.trip{display:flex;gap:12px;align-items:stretch}
.trip .col{flex:1;display:flex;flex-direction:column;gap:6px}
.trip .cell{border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.8px;background:var(--chip-bg);transition:all .25s}
.trip .cell.hl{border-color:var(--accent);background:var(--accent-soft);font-weight:600;transform:translateX(0) scale(1.02)}
.trip .mid{width:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.trip .cable{width:14px;flex:1;max-height:150px;background:linear-gradient(90deg,var(--chip-bg),var(--accent-line));border-radius:7px;position:relative}
.trip .pulse{position:absolute;left:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);top:0;transition:top .5s linear}
.trip .tstep{font-size:12.5px;color:var(--muted);text-align:center;min-height:36px}
@media (max-width:860px){.trip{flex-direction:column}.trip .mid{flex-direction:row;width:100%;height:60px}.trip .cable{width:auto;align-self:stretch;height:14px;flex:none}.trip .pulse{top:-7px;left:0;transition:left .5s}}
.trip .cap{border:1px dashed var(--border);border-radius:9px;padding:9px 12px;font-size:13.8px;min-height:52px;margin-top:12px;background:var(--bg)}
/* topology */
.topo-svg{touch-action:none;user-select:none}
.topo-svg .node{cursor:grab}
.topo-svg .node.sel .shape{stroke:var(--accent);stroke-width:3}
.shape{fill:var(--chip-bg);stroke:var(--border);stroke-width:2}
svg text{fill:var(--text)}
.topo-svg .shape{fill:var(--chip-bg);stroke:var(--border);stroke-width:2}
html[data-theme="dark"] .topo-svg .shape{stroke:#3a4356}
.topo-svg text{fill:var(--text);font-size:12px}
.topo-svg .tlabel{fill:var(--muted);font-size:10.5px}
/* speed */
.ratebar{height:16px;border-radius:8px;background:var(--chip-bg);position:relative;overflow:hidden;margin:6px 0}
.ratebar .fill{height:100%;background:var(--accent);border-radius:8px;transition:width .4s}
.ratebar.cur .fill{background:var(--accent)}
.ratebar .lbl{position:absolute;right:8px;top:-1px;font-size:11.5px;color:var(--text);line-height:16px}
.ovbar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--border);font-size:11px;color:#fff}
.ovbar div{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap}
/* connectors */
.cgal{display:flex;flex-wrap:wrap;gap:10px}
.cgal .cbtn{border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--chip-bg);cursor:pointer;text-align:center;font-size:12.5px;width:128px}
.cgal .cbtn:hover{border-color:var(--accent-line)}
.cgal .cbtn.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.cgal svg{display:block;margin:0 auto 6px}
.cinfo{border:1px solid var(--accent-line);border-radius:10px;padding:12px 14px;font-size:13.8px;background:var(--accent-soft);min-height:96px;margin-top:12px}
.pinsvg .pin{cursor:pointer}
.pinsvg .pin:hover rect,.pinsvg .pin:hover circle{stroke:var(--accent);stroke-width:2.5}
.pinsvg text{fill:var(--text);font-size:11px}
</style>
</head>
<body>
<header class="app">
  <button id="sideToggle" class="iconbtn" title="目录">☰</button>
  <div class="brand">USB 2.0 / USB 3.0 系统课程<small>交互式教程 · 30 单元全部完成（第五阶段）</small></div>
  <span class="verchip" id="genChip">基础·通用</span>
  <div class="progress-wrap"><div class="progress-track"><div class="progress-fill" id="progFill"></div></div><span class="progress-label" id="progLabel">0/30</span></div>
  <div class="spacer"></div>
  <div class="search-wrap">
    <input id="searchInput" type="search" placeholder="搜索课程内容…" autocomplete="off">
    <div id="searchResults"></div>
  </div>
  <button class="iconbtn" id="themeBtn" title="切换明暗主题">🌙</button>
</header>

<nav class="side" id="sideNav"></nav>

<main class="wrap"><article class="article" id="main"></article></main>
<div class="term-pop" id="termPop"></div>

<noscript><div style="padding:80px 20px;text-align:center">本课程需要启用 JavaScript。</div></noscript>

<script>
'use strict';
/* =====================================================================
 * USB 2.0 / 3.0 系统课程 —— 单文件交互式教程
 * 第二阶段样板：U01–U04 已完成内容与交互；U05–U30 为规划大纲页（分阶段开发）。
 * 数据来源与核查状态见 docs/phase1_* 系列文档；课程内标注 ✅已核 / ◐待摘录 / ⏳待补资料。
 * ===================================================================== */

/* ---------- 本地存储（file:// 下 localStorage 不可用时降级为内存） ---------- */
var LS_OK = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } })();
var MEM = {};
function store(k,v){ if(LS_OK){ localStorage.setItem('usbCourse.v1.'+k, JSON.stringify(v)); } else { MEM[k]=v; } }
function load(k,d){ if(LS_OK){ try{ var v=localStorage.getItem('usbCourse.v1.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } } return (k in MEM)?MEM[k]:d; }

var state = {
  theme: load('theme','light'),
  pos: load('pos',1),
  done: load('done',{}),        // {unitId:true}
  quiz: load('quiz',{}),        // {unitId:{score,total}}
  wrong: load('wrong',{})       // {unitId:[qIndex,...]}
};

/* ---------- 术语字典（全课程统一） ---------- */
var DICT = {
  'host':'<b>主机（Host）</b>：USB 系统中唯一的调度者。由主机控制器硬件、根集线器和软件栈（驱动、系统服务）组成，负责发起所有传输、分配带宽、完成枚举与电源管理。',
  'device':'<b>设备（Device）</b>：为主机提供功能（Function）的终端。内部包含若干<b>端点</b>；收到主机请求后应答数据或状态。',
  'hub':'<b>集线器（Hub）</b>：扩展连接点的中间设备：1 个上行端口 + 若干下行端口，负责连接扩展、信号转发与电源管理。USB 3.0 集线器逻辑上是 USB 2.0 集线器与 SuperSpeed 集线器的组合。',
  'endpoint':'<b>端点（Endpoint）</b>：设备侧数据的源或汇，由（设备地址，端点号）标识。EP0 是每个设备必须实现的控制端点。详见第 6 单元。',
  'bus':'<b>总线（Bus）</b>：多设备共享的通信通道。USB 2.0 是半双工广播总线；SuperSpeed 是点对点、双单工的链路结构。',
  'protocol':'<b>协议（Protocol）</b>：通信双方共同遵守的数据格式与时序规则。USB 协议由 USB-IF 官方规范定义。',
  'class':'<b>设备类（Device Class）</b>：对同类功能设备（HID、CDC、大容量存储等）的标准化约定，让主机无需厂商私有驱动即可使用设备。',
  'topology':'<b>拓扑（Topology）</b>：设备的连接结构。USB 是分层的星形（tiered star）：每段线缆都是点对点连接。',
  'tier':'<b>层（Tier）</b>：拓扑中的深度。规范规定最多 7 层（含根层），主机到任一设备之间最多 5 个非根集线器。（USB 2.0 规范 §4.1.1，已核）',
  'vbus':'<b>VBUS</b>：USB 线缆中的 5 V 电源线。规范要求高功率集线器端口提供 4.75–5.25 V，低功率端口 4.4–5.25 V。（USB 2.0 规范 §7.2 压降预算，已核）',
  'dpdm':'<b>D+/D−</b>：USB 2.0 的一对差分信号线，承载所有 USB 2.0 数据与信令；速率识别也依赖上拉电阻所在的位置（D+ 为全速/高速，D− 为低速）。',
  'diff':'<b>差分信号（Differential Signaling）</b>：用两条线的电压差表示逻辑状态，抗共模干扰能力强，是 USB/以太网等高速接口的通用手段。',
  'throughput':'<b>吞吐量（Throughput）</b>：单位时间内实际有效交付的数据量。永远低于原始信号速率，差额来自编码、协议开销与调度。',
  'bandwidth':'<b>带宽（Bandwidth）</b>：总线在单位时间内可承载的数据能力。USB 2.0 以 1 ms 帧 / 125 µs 微帧为时间片调度。',
  'hotplug':'<b>热插拔</b>：不断电插拔。USB 连接顺序（先电源后信号）与连接检测机制保证了热插拔安全。',
  'enum':'<b>枚举（Enumeration）·预告</b>：设备接入后主机读取描述符、分配地址并完成配置的过程，详见第 12 单元。',
  'nrzi':'<b>NRZI 编码 ·预告</b>：USB 2.0 的线路编码：电平翻转表示 0、保持表示 1，配合位填充保证时钟同步。详见第 10 单元。',
  'duplex':'<b>双单工（Dual-Simplex）</b>：发送与接收各用一对差分线，两个方向可同时工作。SuperSpeed 采用双单工；USB 2.0 是半双工。',
  'typec':'<b>USB Type-C</b>：连接器形态规范（24 触点、可正反插）。它是<b>连接器</b>标准，不等于任何协议速率——Type-C 接口同样可能只实现 USB 2.0。',

html:`
<h2>从一个真实问题开始</h2>
<p>把时间拨回 1990 年代中期。你想给台式机接一个鼠标，机箱背后等着你的是：<span class="mono">DB9 串口</span>、<span class="mono">PS/2 键鼠口</span>、<span class="mono">并口</span>、<span class="mono">游戏口</span>……每种外设用一种接口，每种接口配一种插头、一种驱动、一种安装流程。接错了轻则不工作，重则断电重启；串口还限速（常见不过 115200 bit/s），给电脑加一个外设是一件需要"看说明书"的事。</p>
<p>USB（<span class="term" data-t="host">Universal Serial Bus</span>，通用串行总线）在 1996 年落地，目标就是终结这种混乱：</p>
<ul>
  <li><b>统一连接</b>：一个口接尽可能多的外设——鼠标、键盘、U 盘、摄像头、串口适配器、调试器；</li>
  <li><b>热插拔</b>（<span class="term" data-t="hotplug">hotplug</span>）：不用断电重启，插上就能被系统发现；</li>
  <li><b>总线供电</b>：小设备不必自带电源，线缆里就有 5 V 电源线（<span class="term" data-t="vbus">VBUS</span>）；</li>
  <li><b>自动识别与配置</b>：主机读设备"自我介绍"（描述符）后自动安装驱动——这就是后面要学的枚举（<span class="term" data-t="enum">枚举</span>）。</li>
</ul>
<div class="callout">本课程讲 USB 2.0（低速 1.5 Mb/s、全速 12 Mb/s、高速 480 Mb/s）与 USB 3.0 SuperSpeed（5 Gb/s）两代协议，并在 MCU 固件层面落地。每一代的能力边界都会明确标注，不会混在一起讲。</div>

<h2>USB 的分层：五层缺一不可</h2>
<p>初学者最常见的困惑是把几件事混为一谈："<span class="term" data-t="typec">Type-C</span> 接口就是 USB 3.0"、"线是好的协议就通"。实际上 USB 是一条<b>五层结构</b>的链，任何一层出问题，上层都无从谈起。点击下面每一层，看看它管什么、由谁实现：</p>
<div class="widget"><div data-widget="layerStack"></div>
<div class="w-cap">图 V01-1 · USB 五层结构（点击各层查看职责）。自下而上：物理连接器承载电气信号，电气信号上跑协议包，协议包服务于设备类逻辑，最终呈现给应用。</div></div>

<h2>和熟悉的接口比一比</h2>
<p>做过 MCU 开发的你一定用过 UART、SPI、I²C。它们和 USB 的差别不只是"速度"，更在<b>系统模型</b>上：</p>
<table class="tbl">
<tr><th>接口</th><th>典型速率</th><th>拓扑</th><th>谁来调度</th><th>连接/识别</th><th>典型用途</th></tr>
<tr><td>UART</td><td>≤ 1~3 Mb/s（常见 115200 bit/s）</td><td>点对点</td><td>无（双方对等）</td><td>无，需人工约定波特率</td><td>调试串口、模块通信</td></tr>
<tr><td>SPI</td><td>几十 Mb/s</td><td>主从+片选</td><td>主机（MCU）</td><td>无</td><td>Flash、屏幕、传感器</td></tr>
<tr><td>I²C</td><td>100k/400k/1M bit/s</td><td>共享两线</td><td>主机</td><td>7 位地址</td><td>低速外设</td></tr>
<tr><td>CAN</td><td>≤ 1 Mb/s（经典）</td><td>多主总线</td><td>仲裁机制</td><td>报文 ID</td><td>汽车/工业</td></tr>
<tr><td>Ethernet</td><td>10/100/1000 Mb/s+</td><td>交换式星形</td><td>交换机+协议栈</td><td>MAC/IP</td><td>网络</td></tr>
<tr><td><b>USB</b></td><td><b>1.5M / 12M / 480M / 5G bit/s</b></td><td><b>分层星形（主机中心）</b></td><td><b>主机统一调度</b></td><td><b>枚举 + 描述符 + 设备类</b></td><td><b>通用外设</b></td></tr>
</table>
<p>关键差异有两条：① USB 有唯一的<span class="term" data-t="host">主机</span>，所有应用数据传输由它发起（设备不能"想发就发"）；② USB 的设备接入靠协议自动完成（枚举 + 设备类），而 UART/SPI 连"对面是谁"都需要你自己约定。</p>
<div class="callout warn">注意本表只列"量级"用于建立直觉：速率数字在不同规范版本、不同实现下细节各异。严格数值以对应单元引用的规范原文为准。</div>

<h2>一次"数据旅行"：从按键到上屏</h2>
<p>下面用"键盘按下一个键"把五层串起来。请在动画里单步执行，观察数据每一步在哪一层、以什么形态存在：</p>
<div class="widget"><div data-widget="layerTrip"></div>
<div class="w-cap">图 V01-2 · 一次概念化的数据旅行（键盘 → 主机）。此动画是<b>教学模型</b>，用于建立分层直觉；真实的包格式、事务与调度在 U09–U14 展开。</div></div>

<h2>工程实例：MCU 的 CDC 虚拟串口</h2>
<p>你大概用过"USB 转串口"小板：板上是一颗 USB-UART 桥接芯片，电脑插上后多出一个 COM 口。而现代 MCU（包括你将来会用的国产或瑞萨芯片）可以直接把 USB 外设配成 <b>CDC 设备类</b>——电脑同样看到虚拟 COM 口，但串口数据直达你的固件，不需要桥接芯片。</p>
<p>这个例子把五层全部落地：USB 接口（连接器层）→ MCU 的 USB 收发器（电气层）→ 固件里的协议栈应答主机请求（协议层）→ CDC 类约定"这是串口"（设备类层）→ 电脑上的终端程序收发数据（应用层）。后面第 25 单元会带你走完这个开发流程。</p>

<h2>常见误区</h2>
<div class="mis">
  <div class="row bad"><span class="tag">✗</span><span>"USB 线里就 4 根线，协议很简单。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>USB 2.0 线芯确实是 4 根（VBUS、GND、D+、D−），但协议包含包格式、差错控制、调度、枚举等完整体系；USB 3.0 还要再加一对收、一对发共 4 条 SuperSpeed 信号线。导线少 ≠ 协议简单。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"键盘按下按键后，键盘立刻把数据发给电脑。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>USB 2.0 是主机轮询协议：键盘把报告准备好，<b>等主机来取</b>。设备发起异步通知的能力是 USB 3.0 才引入的改进（U20）。"Interrupt 传输"也只是"有保证的轮询间隔"，不是设备打断主机。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"Type-C / 蓝色接口就是 USB 3.0。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>连接器形态与协议能力是两回事。Type-C 只定义外形与触点排布，完全可以只实现 USB 2.0；速率要看实际实现的通路（U04、U23）。</span></div>
</div>

<h2>与 MCU 实现的联系</h2>
<ul>
  <li>MCU 的 USB 外设工作在五层中的<b>下面三层</b>：电气收发、包的装配/校验由硬件（SIE/PHY）完成；描述符、端点缓冲、类逻辑由你的固件负责。</li>
  <li>与 UART 外设开发的本质区别：UART 是"配好波特率就能收发"，USB 设备必须先<b>被主机枚举</b>（回答一系列标准请求）才能传输——所以固件必须有 EP0 请求处理框架（U13、U25）。</li>
  <li>调试思路也随之变化：串口不通先查波特率，USB 不通先查<b>枚举卡在哪一步</b>（U26、U27）。</li>
</ul>

<h2>本单元总结</h2>
<ul>
  <li>USB = 通用串行总线：统一连接、热插拔、总线供电、自动识别配置。</li>
  <li>五层结构：连接器 → 电气 → 协议 → 设备类 → 应用，排障时逐层定位。</li>
  <li>USB 是主机导向系统：USB 2.0 靠轮询调度，应用数据传输由主机发起。</li>
  <li>速率（1.5M/12M/480M/5G bit/s）是原始信号速率，实际吞吐量一定更低。</li>
  <li>连接器形态 ≠ 协议能力，两者要分开判断。</li>
</ul>`,

html:`
<h2>从一个真实问题开始</h2>
<p>假设没有"主机中心"这条规则：U 盘、摄像头、鼠标同时往总线上发数据会怎样？——数据在共享线路上互相打架（冲突），谁也不知道哪段数据归谁。以太网早期用 CSMA/CD 机制硬扛冲突，而 USB 选择了更简单也更适合外设的方案：<b>整个系统只有一个发言调度者——主机（Host）</b>；所有通信都由主机发起、由主机决定时刻。这就是 U01 说的"主机导向"在系统结构上的含义。</p>

<h2>三种角色，三份职责</h2>
<p><b>主机（Host）</b>：主机 = 主机控制器硬件 + 根集线器 + 软件栈（主机控制器驱动、USB 系统软件、类驱动）。它负责：发起并调度所有传输、分配总线时间与带宽、发现并配置设备（枚举）、管理电源。你电脑里的 xHCI/EHCI 控制器和 Windows 的 USB 驱动栈就属于这一层。</p>
<p><b>设备（Device / Function）</b>：功能的提供者。内部由若干<span class="term" data-t="endpoint">端点</span>组成，被动应答主机的请求；它"知道"自己是谁（描述符），但不能主动发起应用数据传输。</p>
<p><b>集线器（Hub）</b>：连接的扩展者。1 个上行端口 + 若干下行端口，职责有三：① <b>连接扩展</b>（让一个口变多个口）；② <b>转发</b>（USB 2.0 中作为中继转发/广播总线流量；SuperSpeed 中则按路由信息转发到指定端口）；③ <b>电源管理</b>（端口供电、过流保护）。USB 3.0 集线器逻辑上是"USB 2.0 集线器 + SuperSpeed 集线器"的组合，两套通路各自转发，电源与地共用。</p>

<h2>拓扑：分层星形与 7 层限制</h2>
<p>USB 的物理连接是<span class="term" data-t="topology">分层星形</span>：每一段线缆都是点对点连接（主机↔集线器、集线器↔集线器、集线器↔设备）。规范原文规定：<i>"由于集线器与线缆传播时间带来的时序约束，允许的最大层数为 7（含根层）；在此 7 层中，主机到任一设备的通信路径上最多支持 5 个非根集线器。"</i>（USB 2.0 规范 §4.1.1，印刷页 16，已核 ✅）</p>
<div class="widget"><div data-widget="topo"></div>
<div class="w-cap">图 V02-2 · 交互拓扑实验。节点可拖动；点击节点查看职责；用"添加集线器/设备"搭出你自己的树；"模拟一次请求"观看主机如何经集线器访问设备。任何设备达到第 8 层（超限）时会被系统拒绝接入——这复现了规范的层数约束。</div></div>

<h2>分步讲解：一次请求的旅程</h2>
<ol>

  <li>鼠标返回数据 → 集线器逐级上传 → 主机控制器交给 USB 系统软件 → 类驱动 → 应用。</li>
</ol>
<p>注意两个细节：① 集线器是"透明"的——主机发一个包，<b>每个</b>设备都会解析它的地址域来决定自己是否响应；② SuperSpeed 改变了这一点：包内携带路由信息，集线器只把包送到目标端口（U20）。</p>

<h2>工程实例：你的开发台</h2>
<p>典型开发台：PC（主机）→ 4 口集线器 → {逻辑分析仪、USB 转串口、调试器} + 集线器下再挂一块带 <b>compound device</b>（复合设备：板上自带集线器+功能）的开发板。复合设备占用两层——原文明确：复合设备接在第 7 层时无法被使能（同上，已核 ✅）。调试"偶尔掉设备"问题时，先数层数、再看集线器供电，是物理层排查的第一步（U27）。</p>

  <div class="row good"><span class="tag">✓</span><span>7 层（含根）、路径上最多 5 个非根集线器是规范的硬性约束（时序预算决定）；超限设备无法被使能。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"设备永远完全被动。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>USB 2.0 中设备确实只能应答（以及通过挂起/远程唤醒等有限机制请求主机注意）；但 USB 3.0 引入了异步通知（设备告知、ERDY 等），设备可以主动告诉主机"我有数据了"——两代差异在 U20 对比。</span></div>

<h2>与 MCU 实现的联系</h2>
<ul>
  <li>MCU 通常扮演<b>设备</b>角色：实现端点、应答请求；固件里没有"调度"代码——调度在主机里，这是 USB 固件与"主从式外设"固件思维的最大不同。</li>
  <li>少数 MCU 支持嵌入式主机/双角色（OTG），可以反向给 U 盘等供电并调度——此时你的固件要承担主机栈的职责，复杂度陡增（书 Ch21 有专门章节）。</li>
  <li>集线器知识直接影响硬件设计：下游端口供电能力、过流保护、VBUS 压降预算（U04、U27）。</li>
</ul>

<h2>本单元总结</h2>
<ul>
  <li>主机唯一且中心化：调度、带宽分配、枚举、电源管理都在主机。</li>
  <li>设备提供端点并应答；集线器扩展连接、转发流量、管理电源。</li>
  <li>分层星形拓扑，最多 7 层（含根层），路径上最多 5 个非根集线器；复合设备占两层。（§4.1.1 已核 ✅）</li>
  <li>USB 2.0：广播 + 地址过滤；SuperSpeed：路由转发 + 异步通知（预告）。</li>
</ul>`,

<p>"我买了个 USB 3.0 的 U 盘，5 Gb/s，为什么拷文件只有三四百 MB/s？广告不是说 625 MB/s 吗？"——这个问题里藏着本单元的全部内容：<b>原始速率 ≠ 有效吞吐</b>。建立这层直觉，将来你看协议分析仪的抓包、估算固件的传输能力，才有判断依据。</p>

<h2>四档速率坐标系</h2>
<p>USB 2.0 规范定义了三档信号速率：低速 LS（Low-Speed）1.5 Mb/s、全速 FS（Full-Speed）12 Mb/s、高速 HS（High-Speed）480 Mb/s（速率值见规范 §1 与 Table 5-3，已核 ✅）；USB 3.0 引入 SuperSpeed（SS），原始链路速率 5 Gb/s。切换下面的选择器，观察同一份数据在不同速率下的理想传输时间：</p>
<div class="widget"><div data-widget="speedCompare"></div>
<div class="w-cap">图 V03-1 · 速率比较器。条形长度按对数比例绘制；"理想时间"= 数据量 ÷ 原始速率，<b>未扣除任何开销</b>，仅用于建立量级直觉。</div></div>

<h2>从原始速率到实际吞吐：被扣掉的四层</h2>
<ol>
  <li><b>编码开销</b>：USB 2.0 用 NRZI + 位填充保证时钟恢复（U10）；SuperSpeed 用 8b/10b 编码——每 10 位只携带 8 位数据，<b>直接打八折</b>（5 Gb/s → 有效上限约 4 Gb/s，此为按编码比推算）。</li>
  <li><b>包结构开销</b>：SYNC、PID、地址/端点域、CRC、握手，每笔交易都要附带这些"信封"。</li>
  <li><b>调度与等待</b>：主机按帧/微帧调度（USB 2.0），或按服务间隔轮询端点；设备没准备好时主机还要重试。</li>
  <li><b>主机软件与缓冲</b>：驱动、系统调度、内存拷贝都消耗时间。</li>
</ol>
<div class="widget"><div data-widget="overheadBar"></div>
<div class="w-cap">图 V03-2 · 规范给出的全速控制传输开销构成（Table 5-2 注：协议开销共 45 字节，不含位填充开销——已核 ✅）。切换载荷大小，观察"有效数据占比"如何被开销稀释。</div></div>

<h2>分步讲解：亲手算一次</h2>
<ol>
  <li>FS 原始速率 12 Mb/s ÷ 8 = 1.5 MB/s（理想上限，不计开销）；</li>

  <li>SuperSpeed 侧：5 Gb/s ÷ 10 × 8 = 4 Gb/s = 500 MB/s（编码后上限，仍不含协议/调度开销）；</li>
  <li>所以"5 Gb/s = 625 MB/s"是把<b>原始速率</b>当成了<b>用户数据</b>，还漏了 8b/10b——两处错误叠加。</li>

<h2>工程实例：MCU 全速设备的合理预期</h2>

html:`
<h2>从一个真实问题开始</h2>
<p>抽屉里那把"看起来都一样"的 USB 线，为什么有的能传文件飞快、有的只能慢速充电？为什么蓝色接口不一定是 USB 3.0，Type-C 也可能只跑 USB 2.0？这一单元把"<b>外形</b>"和"<b>能力</b>"彻底拆开。</p>

<h2>连接器图库</h2>
<p>点击下面的连接器卡片，查看用途与能力。注意：这些是<b>简化示意图</b>，用于建立形状识别；工程开模请以规范的机械图为准。</p>
<div class="widget"><div data-widget="connectorGallery"></div>
<div class="w-cap">图 V04-1 · 连接器示意与能力对照（示意重绘，非规范机械图）。"支持代数"指该连接器形态<b>常见实现</b>的能力范围；具体设备仍以其实际实现的通路为准。</div></div>

<h2>线里有什么：从线芯到触点</h2>
<p><b>USB 2.0</b> 线缆四芯：<span class="term" data-t="vbus">VBUS</span>（+5 V 电源）、GND、<span class="term" data-t="dpdm">D+/D−</span>（一对差分信号线）；Mini/Micro 接口另有 ID 线（用于 OTG 角色识别，课程仅概念提及）。D+ 与 D− 必须<b>成对、等长、双绞</b>——因为它们用<span class="term" data-t="diff">差分信号</span>承载全部 USB 2.0 数据与信令。</p>
<p><b>USB 3.0 SuperSpeed</b> 不与 D+/D− 共线：它新增一对发送差分对（SSTX±）和一对接收差分对（SSRX±），与 USB 2.0 通路并存于同一线缆/接口中——这就是<span class="term" data-t="duplex">双单工</span>的物理基础，也是"USB 3.0 设备插到 USB 2.0 口还能工作"的原因（两套通路各自独立，U23 细讲）。</p>
<div class="widget"><div data-widget="pinExplorer"></div>
<div class="w-cap">图 V04-2 · 触点解释器：左为 USB 2.0 线缆截面（示意），右为 USB 3.0 标准 A 口的双排触点布局（功能分组示意）。触点<b>编号</b>以规范第 6/5 章机械图为准，此处按功能标注（规范引脚图为图版，未做文字转录 ◐）。</div></div>

<h2>供电：VBUS 不只是"有 5 V 就行"</h2>
<p>规范对供电有明确的预算规则（已核 ✅，USB 2.0 规范 §7.2）：高功率集线器端口提供 <b>4.75–5.25 V</b>，低功率端口 <b>4.4–5.25 V</b>；线缆与连接器沿途都有压降预算，因此"超过一个<span class="term" data-t="unitload">单位负载</span>（100 mA）"的设备必须能在端口处 4.75 V 的最坏情况下工作。设备经配置后最多可申请 5 个单位负载（500 mA）。这就是"劣质线/长线导致设备时好时坏"的规范解释——电压被压降吃掉了。</p>
<div class="callout warn">颜色规范：USB 3.0 曾推广"蓝色舌片"作为 SuperSpeed 端口的识别色标，但它属于推广中的习惯标识，<b>不是</b>协议能力的保证——厂商可以不上色（Type-C 通常就不上色）。判断能力请看实现，不要看颜色。</div>

<h2>分步讲解：判断一个接口"能不能跑 USB 3.0"</h2>
<ol>
  <li>看<b>接口形态</b>是否具备 SS 触点（标准 A/B、USB 3.0 Micro-B、Type-C 具备；USB 2.0 Mini/Micro-B 不具备）；</li>
  <li>看<b>设备</b>是否实现了 SS 通路（设备规格书/枚举结果）；</li>
  <li>看<b>线缆</b>是否含 SS 差分对（USB 3.0 线缆 9 芯以上）；</li>
  <li>三者的<b>最小集</b>决定最终速率——任何一环缺 SS 通路，都会回落到 USB 2.0 运行（U23 系统化练习）。</li>
</ol>

<h2>工程实例：MCU 开发板上的选择</h2>
<p>绝大多数 MCU 开发板用 <b>Micro-B（USB 2.0）</b>或 Type-C（但只接了 USB 2.0 通路）作为设备口——因为 FS/HS 外设只用 D+/D−。若你的板子是 HS（高速）方案，还要关注 PCB 布线：D+/D− 等长差分走线、参考地平面、必要时共模滤波与 ESD 器件选型，都属于"信号完整性"范畴；这些器件选大了会让眼图变差反而更不稳定——先抄厂商参考设计，再谈优化（U24 展开）。</p>

<h2>常见误区</h2>
<div class="mis">
  <div class="row bad"><span class="tag">✗</span><span>"Type-C 就是 USB 3.0/3.1。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>Type-C 是<b>连接器</b>规范：24 触点、可正反插、支持正反识别（CC 引脚，概念级）。它完全可以只实现 USB 2.0 通路；反过来 USB 3.0 也可以用传统 A/B/Micro-B 形态。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"USB 2.0 的 Mini/Micro 线也能跑 USB 3.0，只是慢。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>不是"慢"，是<b>没有</b> SS 通路：USB 2.0 Mini/Micro 形态不含 SuperSpeed 触点。USB 3.0 使用专用的 3.0 Micro-B 形态（带 SS 触点），两者外形不同、不能混插。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"蓝色口一定比黑色口快。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>颜色是识别辅助不是能力证明；最终速率由主机、线缆、设备三方实现的最小集决定（U23）。</span></div>
</div>

<h2>与 MCU 实现的联系</h2>
<ul>
  <li>FS 设备的 D+ 上拉电阻（1.5 kΩ，接 3.3 V）是速度识别的一部分——它通常集成在 MCU 内部，但有些设计用外部电阻，位置错了会导致主机识别成低速（U07/U08）。</li>
  <li>HS 设备（480 Mb/s）对布线敏感得多：差分等长、阻抗控制、晶振精度都要按厂商硬件设计指南核对（具体数值属厂商资料，待芯片定型后补充 ⏳）。</li>
  <li>供电设计：自供电设备的 VBUS 检测、总线供电的电流预算，都是"描述符里的 MaxPower 与硬件电路必须一致"的落点（U25）。</li>
</ul>

<h2>本单元总结</h2>
<ul>
  <li>外形与能力分离：连接器形态只决定"能插什么"，能力看实现的通路。</li>
  <li>USB 2.0 四芯：VBUS / GND / D+ / D−（Mini/Micro 另有 ID）。</li>
  <li>USB 3.0 新增 SSTX±/SSRX± 两对差分实现双单工，与 USB2 通路并存。</li>
  <li>VBUS 供电有压降预算：高功率口 4.75–5.25 V、低功率口 4.4–5.25 V、单位负载 100 mA、上限 500 mA（已核 ✅）。</li>
</ul>`,

  'endpoint':'<b>端点（Endpoint）</b>：设备侧数据的源或汇，由（设备地址，端点号）标识；EP0 是每个设备必须实现的双向控制端点。低速设备除 EP0 外最多 2 个额外管道。（USB 2.0 规范 §8.4/§9.6）',

html:`
<h2>从一个真实问题开始</h2>
<p>抓包工具显示你的设备返回了一个"CRC 错误"的数据包，之后主机重发了两次才成功。问题来了：这个 CRC 是谁算的？重试是谁做的？要不要你在固件里写代码处理？——如果你答"固件要处理"，说明分层还没建立起来。<b>分层学习的目的，就是把"谁负责什么"变成肌肉记忆</b>，这样调试时你才能立刻判断问题在哪一层。</p>

<h2>规范的三层模型</h2>
<p>USB 2.0 规范把设备内的通信栈分为三层（§5.2 USB Communication Flow，印刷页 27 起，章节已定位 ◐）：</p>
<ol>
  <li><b>总线接口层（Bus Interface Layer）</b>：物理与电气（PHY）、包的装配与校验（SIE，串行接口引擎）、位级编码与重试。这一层几乎全部由<b>硬件</b>实现。</li>
  <li><b>USB 设备层（USB Device Layer）</b>：设备地址、端点资源、EP0 标准请求、枚举状态机。固件与硬件协作完成。</li>
  <li><b>功能层（Function Layer）</b>：设备"是什么"——HID 报表、CDC 串口数据、大容量存储块读写。全部由<b>固件/类逻辑</b>实现。</li>
</ol>
<p>主机侧对应一条软件栈：应用 → 类驱动 → USB 系统软件（USBD）→ 主机控制器驱动（HCD）→ 主机控制器硬件。规范第 10 章定义主机职责（章节已定位 ◐），操作系统实现各有差异。</p>

html:`
<h2>从一个真实问题开始</h2>
<p>看一段抓包记录：<span class="mono">OUT 0x001 64B → ACK</span>。初学者会问："OUT 是传输吗？0x001 是什么？64B 是包的大小还是传输的大小？ACK 是谁发的？"——如果这五个名词的层级关系不清，抓包数据在你眼里就是一串乱码。这一单元把它们一次性钉死。</p>

<h2>五个名词，一条层级链</h2>
<p><b>Transfer（传输）</b>：一次完整的逻辑搬运，比如"读取 18 字节设备描述符"。它有开始和结束，由类驱动或应用发起。</p>
<p><b>Transaction（事务）</b>：总线上的最小"完整交易"：<b>令牌包 + 数据包 + 握手包</b>。传输太大时会被拆成多个事务。</p>
<p><b>Packet（包）</b>：线上的基本单位：SYNC + PID + 字段 + CRC + EOP。事务由 2~3 个包组成。</p>
<p><b>Endpoint（端点）</b>：设备侧数据的源/汇。由（设备地址 7 位，端点号 4 位）寻址；EP0 是每个功能必须支持的默认控制管道（双向）。</p>
<p><b>Pipe（管道）</b>：主机软件与设备端点之间的逻辑通道。消息管道（EP0）有结构（请求-应答），流管道（bulk/interrupt/iso 用）只是字节流。</p>
<div class="callout">层级口诀：<b>传输拆事务，事务拆包，包指向端点，管道连端点</b>。方向语义以主机为参照：IN=设备→主机，OUT=主机→设备。</div>

<h2>交互：把一次 Bulk OUT 传输逐级拆开</h2>

<h2>分步讲解：从描述符到端点</h2>
<ol>

<p>规范细节（已核 ✅）：令牌包的 CRC5 恰好覆盖 ADDR+ENDP 两个字段（§8.3.5，印刷页 198）；EP0 之外，端点号在同一接口内有效；低速设备除 EP0 外最多两个额外管道（§8.4 印刷页 197）。</p>

<p>接收端靠"电平变化"恢复时钟。但数据里如果出现长串 1（NRZI 下电平长时间不变），接收端时钟就会"失联"。USB 的解法是两件套：<b>NRZI 编码 + 位填充</b>。这两个机制决定了抓包工具能不能恢复数据、你的线缆质量能不能撑住 480 Mb/s。</p>

<h2>NRZI：规则一句话</h2>

  <li>同步端点必须声明所需访问周期；FS/HS 周期端点以 (2^bInterval−1)×F 声明周期（F=1 ms/125 µs，同页已核 ✅）。</li>
</ul>
<div class="callout">注意区分：SS 总线的周期性带宽上限同样存在（80%，中文文档 §4.8.2 已核 ✓），但 SS 是链路化点对点结构，"每微帧排队"的模型不再适用——两代调度模型对比在 U22 展开。</div>

<h2>HS 高带宽周期端点（已核 ✅，§5.9.2 印 57）</h2>
<p>高速中断/同步端点可声明每微帧最多 <b>3 个</b>事务（3×1024 字节），并用 <b>DATA2/DATA1/DATA0</b> 的 PID 序列标识微帧内第 1/2/3 个数据包——单事务时用 DATA0，两事务用 DATA1+DATA0。这就是"高带宽端点"的实现机制。</p>

<h2>常见误区</h2>
<div class="mis">
  <div class="row bad"><span class="tag">✗</span><span>"480 Mb/s ÷ 8 = 60 MB/s，所以每微帧能传 7500 字节。"</span></div>

  <div class="row bad"><span class="tag">✗</span><span>"SOF 每毫秒发一次。"</span></div>

</div>

<h2>工程实例：算一次"5 个 1 ms/200B 中断端点"方案</h2>
<p>FS 中断端点，bInterval=1 ms、载荷 200 字节？——FS 中断最大包 64 字节（U11），200 字节需拆 4 个事务；每事务约（令牌+数据+握手）≈ 100+ 字节线上开销……直接超预算。工程解法：增大轮询间隔（bInterval=2）、减小载荷、或改用 HS 设备。这正是规范表（Table 5-2/5-4 等，印 42–45 ◐）存在的意义——<b>先算后配</b>。</p>

<h2>与 MCU 实现的联系</h2>
<ul>
  <li>固件声明 bInterval 与 wMaxPacketSize 时要会"反向验证"：主机能否满足、总线上还有没有空间。</li>
  <li>HS 设备用高带宽端点（3×1024）时，固件必须按 DATA2/1/0 序列的语义准备三个缓冲（已核 ✅）。</li>
  <li>调度由主机控制器实现，不同主机策略有差异（U05 的"自由度"）；固件不要假设"我的包一定排在微帧开头"。</li>
</ul>

<h2>本单元总结</h2>

  <li>带宽预算在配置阶段完成，不够就拒绝配置。</li>
</ul>`,

<h2>从一个真实问题开始</h2>
<p>协议都懂了，代码从哪开始写？打开厂商 SDK 的 USB 例程，看到一堆寄存器和回调，往往不知"哪行是协议要求、哪行是芯片私有"。<b>本单元建立芯片无关的心智模型</b>——先知道"任何 USB 设备控制器"都长什么样，再看具体芯片手册就有地图了。（芯片选型后按 XHSC/瑞萨资料细化：U24。）</p>

<h2>固件要处理的五类事件</h2>
<table class="tbl">
<tr><th>事件</th><th>对应协议行为</th><th>固件典型动作</th></tr>

<h2>DMA 与内存对齐（通用注意事项）</h2>
<ul>

<h2>芯片无关的 EP0 分发器（伪代码）</h2>
<p class="code">// 状态：地址 addr、配置 cfg、挂起标志
on_reset():    addr=0; cfg=0; ep0_init(CONTROL,64); ep1_init(...); 
on_setup(buf): // 8 字节已由 SIE 校验
  r = parse(buf)
  if r.standard:
    GET_DESCRIPTOR  -> ep0_send_in(desc[r.wValue], r.wLength)  // 分包+零长收尾
    SET_ADDRESS     -> addr_pending=r.wValue; ep0_send_in(0)   // Status 完成后生效
    SET_CONFIGURATION-> cfg=r.wValue; ep0_send_in(0); on_configured(cfg)
    else -> ep0_stall()
  else if r.class: class_dispatch(r)
  else: ep0_stall()
on_in_complete(): if addr_pending { apply_addr(addr_pending); addr_pending=0 }  // U12：2ms 后用新地址
on_out(len):     ring_push(ep1buf, len); class_on_rx()</p>

html:`
<h2>从一个真实问题开始</h2>
<p>2010 年前后，机械硬盘、SSD 与高清视频把 USB 2.0 的 480 Mb/s 逼到了墙角：即使完美的协议实现，实际吞吐也远低于"60 MB/s"的字面换算。USB 3.0（官方称 <b>SuperSpeed</b>）为此重新设计了物理层与协议——不是"把时钟加快"，而是换了一套体系。</p>

<h2>USB 2.0 的三条结构性瓶颈</h2>
<ol>

<p>SS 设备内部同时实现了 USB 2.0 收发器与 SuperSpeed 收发器（集线器则是两套 hub 的组合——中文文档已核 ✓）。插在 USB 2.0 口上，SS 通路训练不到对端，设备走 USB 2.0 通路正常枚举（链路层会把端口置入 SS.Disabled 并尝试其他速度——中文文档 §8.4.5 已核 ✓）。这就是"5 Gb/s 的盘插 2.0 口变成 480 Mb/s 的盘"的机制，U23 系统练习。</p>

<p><b>USB 2.0</b>（bulk IN）：主机在 1 ms 帧内排程 → IN 令牌（广播，全总线可闻）→ 设备 DATA0/DATA1 → 主机 ACK；没准备好回 NAK，主机稍后再试。每 64 字节都要"喊一遍全楼"。</p>
<p><b>SuperSpeed</b>：链路已在 U0（credit 就绪）→ 主机 ACK TP（序号+NumP）→ 设备按序号连发 1024 B×burst 个 DP → 主机逐包 ACK TP；其他链路根本不知道这次通信发生了（路由+低功耗）。每 16 KB 才需要一次"窗口协商"。</p>

<h2>从一个真实问题开始</h2>
<p>打开某 MCU 的 USB 外设章节：几十个寄存器、四种缓冲模式、PLL 时钟树……从哪看起？——先建立<b>通用模型</b>：任何 USB 设备控制器都由"PHY + SIE + 端点缓冲 + 中断/寄存器接口"组成（U15），差别只在各家的实现取舍。有了模型，手册就是"填空题"。（本单元为芯片无关版本；选定 XHSC/瑞萨具体型号后，按其手册补寄存器级细节 ⏳。）</p>

<h2>PHY 方案：集成 vs 外置</h2>
<div class="widget"><div data-widget="phyCompare"></div>
<div class="w-cap">图 V24-1 · 两种 PHY 方案对比（通用示意）。FS 集成 PHY 直连 D+/D−；HS 信号完整性要求高，通常外置专用 PHY 芯片。</div></div>
<ul>
  <li><b>集成 FS PHY</b>：MCU 内含 3.3 V 收发器，D+/D− 直接引出；板上只需上拉（通常控制器内置）、匹配电阻与 ESD 器件。BOM 最低，是多数 FS MCU（含常见国产与瑞萨入门型号）的形态。</li>
  <li><b>外置 HS PHY（如 ULPI 接口）</b>：480 Mb/s 的信号完整性要求超出多数 MCU 制程的舒适区，于是控制器经 ULPI 并行接口外接 PHY 芯片；PHY 需要专用时钟。代价：走线更长、BOM 更高。选型前先问"真的需要 HS 吗"（U03/U11）。</li>
</ul>

<h2>四个通用关注点</h2>
<ol>
  <li><b>时钟</b>：USB 对时钟精度敏感（U10：主机/hub ±0.05% 已核 ✅）。设备侧普遍要求专用精确时钟源（常见配置如 48/60 MHz——具体频率与 PLL 路径必须按所选芯片手册核对 ⏳）；晶振负载电容错误是"插上没反应"的经典原因。</li>
  <li><b>复位与上电顺序</b>：控制器复位 → PHY 就绪 → 上拉接入（U08 的连接检测）；顺序错了主机会误判或看不见设备。</li>
  <li><b>端点缓冲组织</b>：专用缓冲（固定、简单）vs 共享 FIFO（灵活、需分配策略）；双缓冲/乒乓减少 NAK（U15）。缓冲大小必须与 wMaxPacketSize 一致（U12/U25）。</li>
  <li><b>DMA 与内存</b>：大吞吐端点用 DMA 直搬，省 CPU；通用注意点——缓冲对齐、Cache 一致性、DMA 能否访问目标存储区。具体对齐值/寄存器位属芯片资料（⏳）。</li>
</ol>
<div class="widget"><div data-widget="dmaPath"></div>
<div class="w-cap">图 V24-2 · 一次 OUT 接收的两条硬件路径（拷贝 vs DMA；教学示意）。两种路径的协议行为完全相同——差异在 CPU 占用与吞吐上限。</div></div>

<h2>工程实例：读手册的正确姿势</h2>
<p>拿到一块 XHSC HC32 或瑞萨 RA 板做 USB：① datasheet 找"USBFS/USBHS 外设"的引脚与时钟来源；② 参考手册（Reference Manual）读 USB 章节的寄存器模型——对照 U15 的五事件（复位/SETUP/IN 完成/OUT 完成/挂起）找对应中断标志；③ SDK/HAL 抽象层通常已实现协议栈骨架（对应 U05 的"设备层"）；④ 跑官方例程先看枚举再改。每一步都能映射回本课程的一个单元——这就是"先学协议再看芯片"的回报。</p>

<h2>常见误区</h2>

  <div class="row good"><span class="tag">✓</span><span>吞吐受端点缓冲、DMA、固件处理链制约（U14/U15）；缓冲给不起，480 Mb/s 照样跑不满。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"上了 DMA 就一定更快。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>小包高频场景 DMA 建立/中断开销可能反超拷贝成本；按包大小与频率取舍。</span></div>

</div>

<h2>与 MCU 实现的联系</h2>
<p>本单元就是"联系"本身：U15 的固件模型 + 本页的硬件取舍 = 选型与原理图评审清单。把"时钟从哪来、缓冲多大、DMA 到哪、上拉谁管"四个问题在原理图阶段答完，U25 的开发就顺了。</p>

  <li>手册阅读法：datasheet→参考手册→SDK→例程，对照课程分层。</li>
</ul>`,

<h2>描述符设计的四条一致性红线</h2>
<ol>
  <li><b>bMaxPacketSize0 ↔ EP0 实际缓冲</b>：声明 64 就必须真有 64 字节缓冲（否则首次 GET_DESCRIPTOR 就翻车）；</li>

  <li><b>bInterval ↔ 实际处理能力</b>：中断端点承诺了 1 ms 轮询，固件必须供得上（U11/U14）；</li>

<h2>CDC 虚拟串口：第一个完整目标</h2>

<p>CDC = 通信接口（控制，含 Interrupt IN notification 端点）+ 数据接口（Bulk IN/OUT 一对）。主机侧由类驱动（如 Windows 的 usbser）识别——这也是"选 CDC 做 USB 入门"的理由：驱动零安装、端点结构典型、调试有现成终端工具。</p>

<h2>并发与缓冲</h2>
<ul>
  <li><b>环形队列</b>：中断/批量端点的收发都用环形队列解耦"中断上下文"与"应用上下文"；</li>

<h2>从一个真实问题开始</h2>
<p>固件"看起来都对"但设备就是枚举不过。断点不敢下（U25），示波器只能看电平——这时需要<b>协议分析仪</b>：它把总线上的每个包、每条链路事件记成一张表。读懂这张表，USB 调试就从"玄学"变成"读日志"。</p>

<h2>分析仪的两类视角</h2>
<ul>
  <li><b>包视角（USB2）</b>：每行 = 令牌/数据/握手/特殊包，带时间戳、地址、端点、长度与数据十六进制；</li>
  <li><b>链路事件视角（SS）</b>：LTSSM 状态变化（Polling/Recovery/SS.Disabled）、LMP/TP/DP/ITP、credit 事件（U18–U20 的概念直接对应）。</li>
</ul>
<p>工具显示方式各有取舍：有的把"事务"折叠成一行（SETUP+DATA+ACK 一行），有的逐包列行；有的用颜色标注错误。**先读懂自己工具的折叠规则，再下结论**。</p>

<h2>交互：合成枚举抓包浏览器</h2>
<div class="widget"><div data-widget="analyzerView"></div>
<div class="w-cap">图 V26-1 · 枚举抓包浏览器（<b>合成教学数据</b>，非实测记录；行语义与请求序列依据规范 §8.4/§9.4，已核条目见 U09/U12）。点击行查看解读；切换异常模式观察特征差异。</div></div>

<h2>三类典型异常特征（对照浏览器练习）</h2>
<table class="tbl">
<tr><th>特征</th><th>抓包表现</th><th>指向</th></tr>
<tr><td>NAK 洪泛</td><td>同一 IN/OUT 事务反复出现且应答全为 NAK</td><td>正常流控（设备忙）或固件没取缓冲（U11 语义！）</td></tr>
<tr><td>静默丢包</td><td>DATA 包后<b>没有握手</b>，主机重发</td><td>CRC 错（物理层/信号完整性，U10/U27）</td></tr>
<tr><td>STALL</td><td>请求后紧跟 STALL</td><td>请求不支持/端点停摆（U11/U13）</td></tr>
<tr><td>无响应</td><td>只有令牌没有应答，主机超时重试</td><td>设备时钟/上拉/EP0 未就绪（U24/U27）</td></tr>
</table>

<h2>常见误区</h2>
<div class="mis">
  <div class="row bad"><span class="tag">✗</span><span>"抓包里全是 NAK，设备坏了。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>NAK 是正常流控语义（U11 已核 ✅）；要点是看<b>比例与是否最终成功</b>，以及主机是否最终收到数据。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"分析仪显示的速率就是设备标称速率。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>分析仪记录的是"这条链路实际协商/运行"的速率与事件（U23 的方法论）；与标称值的差距正是要分析的对象。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"SS 抓包应该看到 SOF。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>SS 无 SOF，时序基准是 ITP（U20 已核 ✓）；在 SS 抓包里找 SOF 说明模型还没切换。</span></div>
</div>

<h2>工程实例：一次"偶发掉线"的抓包解读</h2>
<p>现象：设备运行数小时后偶发掉线重枚举。抓包看掉线前的最后几行：无错误包、无 STALL——只有"挂起事件"。结论：不是数据错误，是主机/系统电源策略把设备挂起了（U08 的挂起规则 + 系统 PM）。对策：检查远程唤醒实现与系统电源设置。这个案例说明：<b>抓包的价值一半在"看到了什么"，一半在"没看到什么"</b>。</p>

<h2>与 MCU 实现的联系</h2>
<ul>
  <li>固件开发期就把"事件日志"（复位/SETUP/配置变化）接到串口打印——与分析仪互相印证（U25 的调试三部曲）；</li>
  <li>分析仪无法接入的场合（产品外壳内），逻辑分析仪抓 D+/D− 也能看个大概（低速/全速波形）。</li>
</ul>

<h2>本单元总结</h2>
<ul>
  <li>分析仪 = 包视角（USB2）+ 链路事件视角（SS）。</li>
  <li>枚举抓包逐行对应 §9.4 请求与描述符（练习见 V26-1）。</li>
  <li>三类特征：NAK 洪泛（流控）、静默丢包（CRC）、无响应（未就绪）。</li>
  <li>先懂工具的折叠规则，再下结论；"没看到什么"也是线索。</li>
</ul>`,

html:`
<h2>从一个真实问题开始</h2>
<p>"设备不识别"——网上搜到的答案五花八门：换线、重装驱动、改注册表……大概率在浪费时间。工程师的做法是<b>分层排障</b>：每一层用最便宜的检查排除掉一半可能，几次二分就锁定问题层。本单元把 U01 的五层、U24 的硬件、U26 的抓包特征组织成一棵可交互的故障树。</p>

<h2>排障方法论：自底向上，每次二分</h2>
<ol>
  <li><b>物理/供电层</b>（最便宜）：换线、换口、量 VBUS、看上拉；</li>
  <li><b>电气/时钟层</b>：晶振起振、时钟方案、上拉时机（U24）；</li>
  <li><b>协议层</b>：抓包看枚举卡在哪一步（U26 的四类特征）；</li>
  <li><b>类/应用层</b>：描述符语义、类请求处理、固件状态机（U25）。</li>
</ol>

<h2>交互：故障树</h2>
<div class="widget"><div data-widget="faultTree"></div>
<div class="w-cap">图 V27-1 · 交互式故障树（点击症状 → 逐层选择 → 叶子给出检查动作与协议表现）。树为教学综合（E 标注），叶子引用的协议行为均已在前序单元核验。</div></div>

<h2>分步检查清单（可执行版）</h2>
<ol>
  <li>换一条<b>已知好的短线</b>、直插主机口（排除线缆/hub/层数，U02/U23）；</li>
  <li>量 <b>VBUS</b>（4.75–5.25 V 高功率口——U04 已核 ✅）与设备端电压；</li>
  <li>看<b>设备侧电流</b>：接入瞬间有无浪涌、是否维持在挂起电流（U08 已核 ✅）；</li>
  <li>示波器看 <b>D+/D− 空闲电平</b>：FS 空闲应为 J（D+ 高）——不对就查上拉/极性（U08）；</li>
  <li>抓包：<b>有没有复位事件</b>？没有 → 主机根本没发现（回物理层）；有 → 看卡在哪一步（U26）；</li>
  <li>固件日志：复位中断/SETUP 中断到达了吗（U15 五事件）；</li>
  <li>对照<b>描述符</b>逐字段核对（一致性红线，U25）。</li>
</ol>

<h2>常见误区</h2>
<div class="mis">
  <div class="row bad"><span class="tag">✗</span><span>"先重装驱动再说。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>驱动问题的前提是枚举已经成功；枚举失败阶段谈驱动为时过早（U12）。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"偶发问题没法抓。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>分析仪长时间记录 + 触发条件（如掉线时刻）；U26 的案例就是靠"最后几行"定位到电源策略的。</span></div>
  <div class="row bad"><span class="tag">✗</span><span>"速率低就换粗线。"</span></div>
  <div class="row good"><span class="tag">✓</span><span>先判定协商到了哪一档（U23 判断法）：chirp 失败回退 FS 是固件/硬件问题，hub/线缆能力是选型问题——对策完全不同。</span></div>
</div>

<h2>与 MCU 实现的联系</h2>
<ul>
  <li>把故障树的前三层做进固件的"自检日志"：上电打印时钟/上拉/控制器版本，复位中断打印速度档位，枚举各步打印请求——排障时序=log 顺序；</li>
  <li>量产烧录后的"不识别"客诉，第一响应就是让用户做检查单前两条（换线/换口）——成本最低的二分。</li>
</ul>

<h2>本单元总结</h2>
<ul>
  <li>分层二分：物理→电气→协议→类/应用，每层用最便宜的检查。</li>
  <li>四类症状 × 抓包特征 × 检查动作（故障树练习）。</li>
  <li>清单化：把本页七步打印出来贴在工位上。</li>
  <li>"没看到什么"与"看到了什么"同样是证据（U26）。</li>
</ul>`,

<h2>规范规定 vs 主机自由度（实验的核心结论）</h2>

function $(s,r){ return (r||document).querySelector(s); }
function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripTags(h){ var d=document.createElement('div'); d.innerHTML=h; return (d.textContent||d.innerText||''); }
function fmtBytes(bps){
  if(bps>=1e9) return (bps/1e9).toFixed(bps>=1e10?0:2)+' GB/s';
  if(bps>=1e6) return (bps/1e6).toFixed(bps>=1e8?0:2)+' MB/s';
  if(bps>=1e3) return (bps/1e3).toFixed(1)+' KB/s';
  return bps+' B/s';
}
function fmtDur(sec){
  if(sec<1) return (sec*1000).toFixed(0)+' ms';
  if(sec<60) return sec.toFixed(1)+' s';
  var m=Math.floor(sec/60), s=Math.round(sec%60);
  if(m<60) return m+' 分 '+(s?s+' 秒':'');
  var h=Math.floor(m/60); m=m%60; return h+' 时 '+m+' 分';
}

function showTermPop(el){
  var key=el.getAttribute('data-t'); var def=DICT[key]; if(!def) return;

  termPop.style.display='block';
  var r=el.getBoundingClientRect();
  var w=Math.min(340, window.innerWidth-24);

  var left=Math.min(Math.max(8, r.left+window.scrollX-10), window.scrollX+window.innerWidth-w-10);
  var top=r.bottom+window.scrollY+8;
  termPop.style.left=left+'px'; termPop.style.top=top+'px';
}
function hideTermPop(){ termPop.style.display='none'; termPinned=null; }
function initTerms(root){
  $all('.term',root).forEach(function(el){
    el.addEventListener('mouseenter',function(){ clearTimeout(termHideT); if(termPinned!==el) showTermPop(el); });

}

/* ============================== 测验引擎 ============================== */
function renderQuiz(id,qs,mount){
  var h='';
  qs.forEach(function(item,qi){
    h+='<div class="q-item" data-qi="'+qi+'"><div class="q-title"><span class="qno">Q'+(qi+1)+'.</span>'+item.q+'</div>';
    item.opts.forEach(function(op,oi){
      h+='<label class="opt"><input type="'+(item.multi?'checkbox':'radio')+'" name="q'+qi+'" value="'+oi+'">'+esc(op)+'</label>';
    });
    h+='<div class="exp">'+(item.multi?'正确答案：'+item.a.map(function(i){return String.fromCharCode(65+i);}).join('、')+'。 ':'')+esc(item.exp)+'</div></div>';
  });
  h+='<div><button class="btn" id="qSubmit">提交答案</button> <button class="btn ghost" id="qReset">重做</button><span class="w-note" style="margin-left:10px">得分 ≥60% 自动标记本单元完成。</span></div><div class="result" id="qResult"></div>';
  mount.innerHTML=h;
  var answered=function(){ return qs.every(function(item,qi){ return $all('input[name="q'+qi+'"]',mount).some(function(i){ return i.checked; }); }); };
  $('#qSubmit',mount).addEventListener('click',function(){
    if(!answered()){ $('#qResult',mount).textContent='还有题目未作答。'; $('#qResult',mount).className='result no'; return; }
    var score=0, wrong=[];
    qs.forEach(function(item,qi){
      var picked=$all('input[name="q'+qi+'"]',mount).filter(function(i){return i.checked;}).map(function(i){return parseInt(i.value,10);}).sort();
      var key=item.a.slice().sort();
      var ok=picked.length===key.length&&picked.every(function(v,i){return v===key[i];});
      if(ok) score++; else wrong.push(qi);
      var qEl=$('[data-qi="'+qi+'"]',mount);
      $all('.opt',qEl).forEach(function(optEl,oi){
        optEl.classList.remove('correct','wrong');
        if(key.indexOf(oi)>=0) optEl.classList.add('correct');
        else if(picked.indexOf(oi)>=0) optEl.classList.add('wrong');
      });
      $('.exp',qEl).classList.add('show');
    });
    var res=$('#qResult',mount);
    res.textContent='得分：'+score+' / '+qs.length+(score/qs.length>=0.6?'（已自动标记完成）':'（未达 60%，建议回顾后重做）');
    res.className='result '+(score/qs.length>=0.6?'ok':'no');
    state.quiz[id]={score:score,total:qs.length};
    state.wrong[id]=wrong;
    store('quiz',state.quiz); store('wrong',state.wrong);
    if(score/qs.length>=0.6&&!state.done[id]){ state.done[id]=true; store('done',state.done); buildSidebar(); updateSidebarActive(); updateProgress(); var db=document.getElementById('doneBtn'); if(db) db.textContent='✓ 已标记完成（点击撤销）'; }
  });
  $('#qReset',mount).addEventListener('click',function(){ renderQuiz(id,qs,mount); });
}

var searchT=null;

  var input=$('#searchInput'), box=$('#searchResults');

    clearTimeout(searchT);
    searchT=setTimeout(function(){
      var q=input.value.trim().toLowerCase();
      if(q.length<1){ box.style.display='none'; return; }
      var hits=INDEX.filter(function(it){ return it.text.indexOf(q)>=0; }).slice(0,12);
      var h='';

      });

WIDGETS['topo']=function(el){

  var svg=$('svg',el), msg=$('[data-a="msg"]',el), info=$('[data-a="info"]',el);
  var nodes=[], sel=null, uid=0, animId=null;
  var ROLE={
   host:'<b>主机（含根集线器）</b>：唯一调度者。发起所有传输、分配带宽、枚举设备、管理电源。根集线器集成在主机控制器内。',
   hub:'<b>集线器</b>：1 上行 + N 下行端口。职责：连接扩展、转发总线流量（USB2 广播中继 / SS 按路由转发）、电源管理与过流保护。',
   dev:'<b>设备（Function）</b>：提供端点，被动应答主机请求；不能主动发起应用数据传输（USB 3.0 的异步通知除外，见 U20）。'
  };
  function tier(n){ var t=1,c=n; while(c.parent){ c=c.parent; t++; } return t; }
  function add(type,parent,x,y){
    if(type!=='host'){
      var t=parent?tier(parent)+1:2;
      if(t>7){ msg.textContent='已超过 7 层，无法接入（规范 §4.1.1：含根层最多 7 层）'; return null; }
      if(type==='hub'&&t>=7){ msg.textContent='第 7 层只能接设备（再挂子节点将超 7 层）'; return null; }
    }
    var n={id:++uid,type:type,parent:type==='host'?null:parent,x:x,y:y};

  }
  function layoutDefault(){
    nodes=[]; sel=null;

    var h1=add('hub',host,240,180);
    add('dev',h1,430,90); add('dev',h1,430,270);
    return host;
  }
  function draw(){
    var h='';
    h+='<line x1="0" y1="0" x2="0" y2="0" data-hidden="1" stroke="none"/>';
    nodes.forEach(function(n){
      if(n.parent){ var p=n.parent;
        h+='<line data-edge="'+n.id+'" x1="'+p.x+'" y1="'+p.y+'" x2="'+n.x+'" y2="'+n.y+'" stroke="var(--border)" stroke-width="2.5"/>';
      }
    });
    nodes.forEach(function(n){
      var shape='',label='';
      if(n.type==='host'){ shape='<rect class="shape" x="-44" y="-24" width="88" height="48" rx="8"/><text text-anchor="middle" y="-4">主机</text><text class="tlabel" text-anchor="middle" y="12">含根集线器</text>'; label=''; }
      else if(n.type==='hub'){ shape='<rect class="shape" x="-24" y="-19" width="48" height="38" rx="7"/><text text-anchor="middle" y="4">Hub</text>'; label='<text class="tlabel" text-anchor="middle" y="34">集线器</text>'; }
      else { shape='<circle class="shape" r="17"/><text text-anchor="middle" y="4">D</text>'; label='<text class="tlabel" text-anchor="middle" y="34">设备</text>'; }
      var tl=(n.type!=='host')?'<text class="tlabel" text-anchor="middle" y="47">第 '+tier(n)+' 层</text>':'';
      h+='<g class="node'+(sel===n?' sel':'')+'" data-id="'+n.id+'" transform="translate('+n.x+','+n.y+')">'+shape+label+tl+'</g>';

    });

  }
  var drag=null;
  function startDrag(ev,n,g){

  }
  function onMove(ev){
    if(!drag) return;
    var pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
    var ctm=svg.getScreenCTM().inverse(); var sp=pt.matrixTransform(ctm);
    var n=drag.n;
    n.x=Math.max(60,Math.min(720,sp.x-drag.dx));
    n.y=Math.max(40,Math.min(370,sp.y-drag.dy));
    drag.g.setAttribute('transform','translate('+n.x+','+n.y+')');
    nodes.forEach(function(c){
      if(c.parent===n||c===n){
        var line=$('[data-edge="'+c.id+'"]',svg);

      }
    });
  }
  function onUp(){ drag=null; svg.removeEventListener('pointermove',onMove); svg.removeEventListener('pointerup',onUp); draw(); }
  function simulate(){
    if(animId) return;
    var target=sel&&sel.type==='dev'?sel:nodes.filter(function(n){return n.type==='dev';})[0];
    if(!target){ msg.textContent='请先添加一个设备。'; return; }
    var path=[]; var c=target; while(c){ path.unshift(c); c=c.parent; }
    var pts=path.map(function(n){ return [n.x,n.y]; });
    var way=[],i;
    for(i=0;i<pts.length;i++) way.push(pts[i]);

      var a=way[s], b=way[s+1];
      dot.setAttribute('cx',a[0]+(b[0]-a[0])*k); dot.setAttribute('cy',a[1]+(b[1]-a[1])*k);
      info.innerHTML= s<fwd ? ('请求下行：第 '+(s+1)+'/'+fwd+' 段（逐级转发；USB2 为广播+地址过滤）')
                            : ('设备应答上行：第 '+(s-fwd+1)+'/'+fwd+' 段（逐级上传）');
    },40);
  }
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a]'); if(!b) return;

/* 通用步进播放器：opts = {title, steps:[{cap, draw(ctx)}], interval, onReset} */
function mkStepPlayer(el, opts){
  if(!opts.noTemplate){
    el.innerHTML='<div class="w-toolbar"><span class="title">'+opts.title+'</span>'+
     '<button class="ctl" data-a="play">▶ 播放</button><button class="ctl" data-a="step">单步 ▸</button>'+
     '<button class="ctl" data-a="reset">重置</button>'+
     '<select class="ctl" data-a="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="2">2×</option></select>'+
     (opts.extra||'')+'</div><div class="w-body" data-a="body"></div>'+
     (opts.capAlways?'<div class="w-body" data-a="capbox"></div>':'');
  }
  var P={el:el, idx:-1, timer:null, speed:1, opts:opts};
  P.body=el.querySelector('[data-a="body"]');
  P.capbox=el.querySelector('[data-a="capbox"]');
  P.show=function(i){
    P.idx=i; var s=opts.steps[i];
    opts.render(P, s, i);
    var cap=(opts.capAlways? P.capbox : (opts.capIn? opts.capIn(P): P.body.querySelector('.stepcap')));
    if(cap){ var el2=cap; el2.innerHTML='<b>'+(i+1)+'/'+opts.steps.length+'</b>　'+s.cap; }
  };
  P.stop=function(){ if(P.timer){ clearInterval(P.timer); P.timer=null; var b=el.querySelector('[data-a="play"]'); if(b) b.textContent='▶ 播放'; } };
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a]'); if(!b) return;
    var a=b.getAttribute('data-a');
    if(a==='play'){
      if(P.timer){ P.stop(); return; }
      if(P.idx>=opts.steps.length-1) P.idx=-1;
      b.textContent='⏸ 暂停';
      P.show(P.idx+1);
      P.timer=setInterval(function(){ if(P.idx>=opts.steps.length-1){ P.stop(); return; } P.show(P.idx+1); }, (opts.interval||1600)/P.speed);
    } else if(a==='step'){ P.stop(); if(P.idx>=opts.steps.length-1) P.idx=-1; P.show(P.idx+1); }
    else if(a==='reset'){ P.stop(); P.idx=-1; if(opts.onReset) opts.onReset(P); }
  });
  var sp=el.querySelector('[data-a="speed"]');
  if(sp) sp.addEventListener('change',function(ev){ P.speed=parseFloat(ev.target.value); if(P.timer){ var b=el.querySelector('[data-a="play"]'); P.stop(); b.click(); } });
  if(opts.onReset) opts.onReset(P);
  return P;
}

         '④ 设备检测到交替序列 → 在 TWTHS 内<b>移除 D+ 上拉、使能高速端接</b>，进入高速默认态。',

   reset:{name:'复位（SE0 ≥10 ms）',segs:[{dp:1,dm:0,t:14,label:'J（空闲）'},{dp:0,dm:0,t:46,label:'SE0 —— 复位（≥10 ms）'},{dp:1,dm:0,t:14,label:'J（复位结束）'}]},
   suspend:{name:'挂起（空闲 >3 ms）',segs:[{dp:1,dm:0,t:16,label:'J（有流量）'},{dp:1,dm:0,t:52,label:'J —— 空闲持续 >3.0 ms → 设备必须挂起，≤10 ms 内降流'},{dp:1,dm:0,t:10,label:''}]},
   resume:{name:'恢复（K ≥20 ms）',segs:[{dp:1,dm:0,t:14,label:'挂起中（J 空闲）'},{dp:0,dm:1,t:46,label:'K —— 主机恢复信令（≥20 ms）'},{dp:1,dm:0,t:14,label:'结束恢复'}]},
   chirp:{name:'HS 检测握手中的 Chirp（概念）',segs:[{dp:0,dm:0,t:16,label:'SE0（复位信令）'},{dp:0,dm:1,t:24,label:'Chirp-K（设备发出）'},{dp:1,dm:0,t:14,label:'Chirp-J'},{dp:0,dm:1,t:14,label:'Chirp-K'},{dp:1,dm:0,t:14,label:'Chirp-J（主机交替应答）'},{dp:0,dm:0,t:16,label:''}]}
  };
  el.innerHTML='<div class="w-toolbar"><span class="title">总线状态波形观察器（概念示意）</span><select class="ctl" data-a="scene"></select><button class="ctl" data-a="run">▶ 播放</button><span class="w-note">非合规示波器波形；仅表达状态序列与相对时长。</span></div>'+
   '<div class="w-body"><canvas data-a="cv" width="760" height="190" style="width:100%;max-width:760px"></canvas><div class="cap" data-a="cap"></div></div>';
  var sel=$('[data-a="scene"]',el);
  Object.keys(SCENES).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=SCENES[k].name; sel.appendChild(o); });
  var cv=$('[data-a="cv"]',el), cap=$('[data-a="cap"]',el);
  var timer=null, upTo=0;
  function draw(nSeg){
    var ctx=cv.getContext('2d');
    var cs=getComputedStyle(document.documentElement);
    var cText=cs.getPropertyValue('--text').trim()||'#000', cDp=cs.getPropertyValue('--accent').trim()||'#36c', cDm=cs.getPropertyValue('--warn').trim()||'#c73';
    var W=cv.width, H=cv.height;
    ctx.clearRect(0,0,W,H);
    var segs=SCENES[sel.value].segs.slice(0,nSeg);
    var total=0; segs.forEach(function(s){total+=s.t;});
    if(total===0) total=1;
    var x0=46, w=(W-x0-14), mid=H/2;
    function segX(i){ var acc=0; for(var j=0;j<i;j++) acc+=segs[j].t; return x0+acc/total*w; }
    ctx.strokeStyle=cText; ctx.fillStyle=cText; ctx.font='12px sans-serif'; ctx.globalAlpha=.8;
    ctx.fillText('D+', 10, mid-28); ctx.fillText('D−', 10, mid+34); ctx.globalAlpha=1;
    segs.forEach(function(s,i){
      var xa=segX(i), xb=segX(i+1);
      var yTop = s.dp? mid-40 : mid;
      var yBot = s.dm? mid+40 : mid;
      ctx.strokeStyle=cDp; ctx.lineWidth=2.5;
      ctx.beginPath();
      if(i===0){ ctx.moveTo(xa, yTop); } else {
        var prev=segs[i-1];
        if(prev.dp!==s.dp){ ctx.moveTo(xa, prev.dp? mid-40:mid); ctx.lineTo(xa, yTop); } else ctx.moveTo(xa,yTop);
      }
      ctx.lineTo(xb, yTop); ctx.stroke();
      ctx.strokeStyle=cDm; ctx.beginPath();
      if(i===0){ ctx.moveTo(xa, yBot); } else {
        var prev2=segs[i-1];
        if(prev2.dm!==s.dm){ ctx.moveTo(xa, prev2.dm? mid+40:mid); ctx.lineTo(xa, yBot); } else ctx.moveTo(xa,yBot);
      }
      ctx.lineTo(xb, yBot); ctx.stroke();
      if(s.label){ ctx.fillStyle=cText; ctx.font='11.5px sans-serif'; ctx.globalAlpha=.85;
        ctx.fillText(s.label, Math.min(xa+4, W-160), mid-56 + (i%2)*0); ctx.globalAlpha=1; }
    });
  }
  function stop(){ if(timer){ clearInterval(timer); timer=null; var b=$('[data-a="run"]',el); b.textContent='▶ 播放'; } }
  $('[data-a="run"]',el).addEventListener('click',function(){
    stop();
    var b=$('[data-a="run"]',el);
    b.textContent='⏸ 暂停';
    var n=SCENES[sel.value].segs.length;
    upTo=1; draw(upTo);
    timer=setInterval(function(){ upTo++; if(upTo>n){ upTo=n; stop(); return; } draw(upTo); },420);
  });
  sel.addEventListener('change',function(){ stop(); cap.textContent=''; draw(SCENES[sel.value].segs.length); });
  draw(SCENES.fs_idle.segs.length);
};

/* --- U10 NRZI 编码器 --- */
WIDGETS['nrziEncoder']=function(el){
  el.innerHTML='<div class="w-toolbar"><span class="title">NRZI 编码器 + 位填充演示</span>'+
   '<input class="ctl" data-a="bits" style="width:220px" value="011110111110011" maxlength="40">'+
   '<button class="ctl" data-a="apply">编码</button><button class="ctl" data-a="ones">预设：7 个 1</button>'+
   '<label><input type="checkbox" data-a="showstuff" checked> 标记填充位</label><span class="w-note" data-a="stat"></span></div>'+
   '<div class="w-body"><canvas data-a="cv" width="760" height="200" style="width:100%;max-width:760px"></canvas><div class="w-note">上行：原始比特 → 插入填充 0 → 下行：NRZI 电平（高=J）。填充规则：每 6 个连续 1 之后、编码之前插入 0（规范 §7.1.8 已核 ✅）。</div></div>';
  var cv=$('[data-a="cv"]',el);
  function parse(){
    var v=$('[data-a="bits"]',el).value;
    if(!/^[01]{1,40}$/.test(v)){ $('[data-a="stat"]',el).textContent='输入必须是 1–40 个 0/1 字符'; return null; }
    return v.split('').map(function(c){return +c;});
  }
  function draw(){
    var bits=parse(); if(!bits) return;
    // 位填充
    var out=[], stuffed=[], run=0;
    bits.forEach(function(b){
      out.push(b); stuffed.push(false);
      if(b===1){ run++; if(run===6){ out.push(0); stuffed.push(true); run=0; } } else run=0;
    });
    // NRZI
    var level=1; // 起始 J（空闲）
    var levels=[];
    out.forEach(function(b){ if(b===0) level=1-level; levels.push(level); });
    var ctx=cv.getContext('2d');
    var cs=getComputedStyle(document.documentElement);
    var cT=cs.getPropertyValue('--text').trim()||'#000', cA=cs.getPropertyValue('--accent').trim()||'#36c', cR=cs.getPropertyValue('--bad').trim()||'#c33';
    var W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    var n=out.length, x0=30, w=(W-x0-16)/n, mid=H/2+10;
    // 原始+填充行
    ctx.font='13px monospace'; ctx.textAlign='center';
    out.forEach(function(b,i){
      ctx.fillStyle=stuffed[i]?cR:cT;
      ctx.fillText(b, x0+i*w+w/2, 28);
      if(stuffed[i]){ ctx.fillStyle=cR; ctx.font='10px sans-serif'; ctx.fillText('填充', x0+i*w+w/2, 44); ctx.font='13px monospace'; }
    });
    // 波形
    ctx.strokeStyle=cA; ctx.lineWidth=2.5; ctx.beginPath();
    var prevY=level? mid-30: mid+30;
    ctx.moveTo(x0, prevY);
    levels.forEach(function(l,i){
      var y=l? mid-30: mid+30;
      var xa=x0+i*w, xb=xa+w;
      if(y!==prevY){ ctx.lineTo(xa,y); }
      ctx.lineTo(xb,y);
      prevY=y;
    });
    ctx.stroke();
    ctx.strokeStyle=cT; ctx.globalAlpha=.5; ctx.beginPath();
    ctx.moveTo(x0,mid-30); ctx.lineTo(W-8,mid-30); ctx.moveTo(x0,mid+30); ctx.lineTo(W-8,mid+30); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillStyle=cT; ctx.textAlign='left'; ctx.font='11px sans-serif';
    ctx.fillText('J(高)', 2, mid-27); ctx.fillText('K(低)', 2, mid+33);
    $('[data-a="stat"]',el).textContent='输入 '+bits.length+' 位 → 编码 '+out.length+' 位（插入 '+(out.length-bits.length)+' 个填充位）';
  }
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a]'); if(!b) return;
    if(b.getAttribute('data-a')==='apply') draw();
    if(b.getAttribute('data-a')==='ones'){ $('[data-a="bits"]',el).value='1111111'; draw(); }
  });
  $('[data-a="bits"]',el).addEventListener('keydown',function(ev){ if(ev.key==='Enter') draw(); });
  draw();
};

/* 通用泳道播放器：lanes=[名,名]；msgs=[{f:0|1,label,cap,fail}] */
function lanePlayer(el, opts){
  el.innerHTML='<div class="w-body"><svg width="100%" viewBox="0 0 640 '+ (70+opts.msgs.length*34) +'" style="display:block"></svg></div>'+
   '<div class="cap" data-a="cap" style="border:1px dashed var(--border);border-radius:9px;padding:8px 12px;margin:0 14px 12px;font-size:13.5px;min-height:44px"></div>';
  var svg=el.querySelector('svg');
  function draw(){
    var h='<rect x="10" y="6" width="180" height="30" rx="8" class="shape"/><text x="100" y="26" text-anchor="middle">'+opts.lanes[0]+'</text>'+
     '<rect x="450" y="6" width="180" height="30" rx="8" class="shape"/><text x="540" y="26" text-anchor="middle">'+opts.lanes[1]+'</text>';
    opts.msgs.forEach(function(m,i){
      var y=70+i*34, x1=m.f===0?195:445, x2=m.f===0?445:195;
      var mid=(x1+x2)/2;
      var ax = (m.f===0)? [x2+','+y+' '+(x2-9)+','+(y-5)+' '+(x2-9)+','+(y+5)] : [x2+','+y+' '+(x2+9)+','+(y-5)+' '+(x2+9)+','+(y+5)];
      h+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="var(--accent-line)" stroke-width="2" data-m="'+i+'" '+
        (m.fail?'stroke-dasharray="5 4" stroke="var(--bad)"':'')+'/>';
      h+='<polygon points="'+ax.join(' ')+'" data-m="'+i+'" fill="'+(m.fail?'var(--bad)':'var(--accent)')+'"/>';
      h+='<text x="'+mid+'" y="'+(y-6)+'" text-anchor="middle" font-size="11.5">'+m.label+'</text>';
    });
    svg.innerHTML=h;
  }
  var P={idx:-1,timer:null,speed:1};
  P.show=function(i){
    P.idx=i; $all('[data-m]',svg).forEach(function(x){x.setAttribute('opacity','.25');});
    opts.msgs.slice(0,i+1).forEach(function(m,k){ $all('[data-m="'+k+'"]',svg).forEach(function(x){x.setAttribute('opacity','1');}); });
    el.querySelector('[data-a="cap"]').innerHTML='<b>'+(i+1)+'/'+opts.msgs.length+'</b>　'+opts.msgs[i].cap;
  };
  P.reset=function(){ $all('[data-m]',svg).forEach(function(x){x.setAttribute('opacity','.25');}); el.querySelector('[data-a="cap"]').innerHTML='点击"播放"或"单步"开始。'; };
  draw(); P.reset(); return P;
}

WIDGETS['enumPlayer']=function(el){
  el.innerHTML='<div class="w-toolbar"><span class="title">枚举播放器</span>'+
   '<label>故障注入：<select class="ctl" data-a="fault"><option value="none">无（正常枚举）</option><option value="len">描述符 bMaxPacketSize0 错误</option><option value="stall">GET_DESCRIPTOR 回 STALL</option><option value="timeout">固件不应答（超时）</option></select></label>'+
   '<button class="ctl" data-a="play">▶ 播放</button><button class="ctl" data-a="step">单步 ▸</button><button class="ctl" data-a="reset">重置</button></div>'+
   '<div class="w-body" data-a="host"></div><div class="w-body"><div class="callout" data-a="diag" style="display:none;margin:0"></div></div>';
  var P=null, curMsgs=[];
  function build(){
    var fault=$('[data-a="fault"]',el).value;
    var M=[
     {f:0,label:'检测到设备接入',cap:'上拉抬线 → 集线器向主机报告端口变化（U08）。'},
     {f:0,label:'端口复位（SE0 ≥10ms）',cap:'复位后设备处于 Default 态（地址 0）；HS 设备同时完成 chirp 协商。'},
     {f:0,label:'SETUP：GET_DESCRIPTOR(Device) wLength=8',cap:'主机先只要 8 字节——为的是拿到 bMaxPacketSize0（第 8 字节）。'},
    ];
    if(fault==='len'){ M.push({f:1,label:'DATA1：8 字节（bMaxPacketSize0=255）',cap:'【故障】设备声称 EP0 最大包 255（非法值，规范只允许 8/16/32/64）——主机解析异常。',fail:true});
      M.push({f:0,label:'主机中止枚举',cap:'【结果】设备管理器显示"未知设备"。抓包特征：描述符内容与规范约束矛盾。',fail:true}); }
    else if(fault==='stall'){ M.push({f:1,label:'STALL',cap:'【故障】设备对 GET_DESCRIPTOR 回 STALL（固件 EP0 分发器没实现标准请求）。',fail:true});
      M.push({f:0,label:'主机重试数次后放弃',cap:'【结果】枚举失败。抓包特征：第一个标准请求即 STALL——九成是固件 EP0 处理缺失。',fail:true}); }
    else if(fault==='timeout'){ M.push({f:0,label:'SETUP：GET_DESCRIPTOR…（重试 ×3）',cap:'【故障】设备固件未使能 EP0/未响应 → 主机超时重试。',fail:true});
      M.push({f:0,label:'主机放弃',cap:'【结果】"设备接入时好时坏"或完全不识别。抓包特征：只有令牌没有响应包。检查：时钟、上拉时机、EP0 初始化。',fail:true}); }
    else { M.push({f:1,label:'DATA1：8 字节描述符',cap:'设备回前 8 字节：含 bMaxPacketSize0=64（示例值）。'}); }
    if(fault==='none'||fault==='len'||fault==='stall'||fault==='timeout'){
      if(fault==='none'){
        M.push({f:0,label:'SET_ADDRESS（地址=0x42）',cap:'主机分配唯一地址。'});
        M.push({f:1,label:'状态完成（2 ms 恢复）',cap:'Status 阶段结束后，设备在 2 ms 内切换地址、不再响应地址 0（已核 ✅）。'});
        M.push({f:0,label:'GET_DESCRIPTOR(Device) wLength=18',cap:'用新地址读完整 18 字节设备描述符。'});
        M.push({f:1,label:'DATA0/DATA1：18 字节',cap:'VID/PID/类码/配置数…（分包发送，见 U13）。'});
        M.push({f:0,label:'GET_DESCRIPTOR(Configuration)',cap:'读配置描述符（主机先探 9 字节拿总长，再读全量——顺序属主机自由度）。'});
        M.push({f:1,label:'配置+接口+端点描述符',cap:'一次事务流里返回整棵子树（wTotalLength）。'});
        M.push({f:0,label:'SET_CONFIGURATION(1)',cap:'主机选中配置 1。'});
        M.push({f:1,label:'状态完成 → Configured',cap:'设备进入 Configured 态，功能端点可用。枚举完成！'});
      } else {
        M.push({f:0,label:'枚举中止',cap:'【对照】正常枚举后续还有 SET_ADDRESS → 完整描述符 → SET_CONFIGURATION（切换到"无故障"可看全流程）。',fail:true});
      }
    }
    P=lanePlayer($('[data-a="host"]',el), {lanes:['主机','设备'],msgs:M});
    curMsgs=M;
    var diag=$('[data-a="diag"]',el);
    if(fault!=='none'){ diag.style.display='block'; diag.innerHTML='<b>故障定位提示：</b>'+(fault==='len'?'bMaxPacketSize0 只允许 8/16/32/64（§9.6.3）；描述符是固件的 const 数据，改表即可。':(fault==='stall'?'标准请求必须由 EP0 分发器实现（U13 骨架）；未实现的标准请求不能 STALL 了事。':'先查硬件事件链：时钟起振 → 上拉时机 → EP0 使能 → SETUP 中断到达（U15 五事件）。'));}
    else diag.style.display='none';
  }
  $('[data-a="fault"]',el).addEventListener('change',function(){ build(); });
  el.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-a="play"],[data-a="step"],[data-a="reset"]'); if(!b||!P) return;
    var a=b.getAttribute('data-a');
    var M=curMsgs;
    if(a==='play'){ if(P.timer){ clearInterval(P.timer); P.timer=null; b.textContent='▶ 播放'; return; }
      if(P.idx>=M.length-1) P.idx=-1; b.textContent='⏸ 暂停'; P.show(P.idx+1);
      P.timer=setInterval(function(){ if(P.idx>=M.length-1){ clearInterval(P.timer); P.timer=null; b.textContent='▶ 播放'; return; } P.show(P.idx+1); },1400);
    } else if(a==='step'){ if(P.timer){ clearInterval(P.timer); P.timer=null; var pb=el.querySelector('[data-a="play"]'); if(pb) pb.textContent='▶ 播放'; }
      if(P.idx>=M.length-1) P.idx=-1; P.show(P.idx+1);
    } else if(a==='reset'){ if(P.timer){ clearInterval(P.timer); P.timer=null; } P.idx=-1; P.reset(); }
  });
  build();
};

/* --- U13 EP0 状态机 --- */
WIDGETS['ep0fsm']=function(el){
  var ST={
   idle:{n:'空闲',d:'等待 SETUP。任何时刻收到 SETUP → 立即进入"已收 SETUP"（即使上一传输未完成——Early SETUP 中止当前流程）。'},
   datain:{n:'数据阶段（IN）',d:'读请求：主机连续 IN，设备按 wLength 分包发送；最后一包不足 wLength 用短包/零长包收尾。'},
   dataout:{n:'数据阶段（OUT）',d:'写请求：主机连续 OUT，设备收满 wLength 字节（超长的包会终止传输并视为错误）。'},
   statin:{n:'状态阶段（IN）',d:'写/无数据请求：设备发零长包表示"完成"。'},
   statout:{n:'状态阶段（OUT）',d:'读请求：主机发零长包确认设备完成。'},
   stall:{n:'STALL（暂停）',d:'请求不支持/数据阶段错误。控制端点的 STALL 在下一个 SETUP 自动清除（已核 ✅）。'}
  };
  var TR=[
   ['idle','datain','SETUP 且 D7=1 且 wLength>0（读）'],
   ['idle','dataout','SETUP 且 D7=0 且 wLength>0（写）'],
   ['idle','statin','SETUP 且 wLength=0（无数据）'],
   ['datain','statout','数据发完（wLength 字节）'],
   ['dataout','statin','数据收完'],
   ['statout','idle','收到零长包 → 传输完成'],
   ['statin','idle','主机确认 → 传输完成'],
   ['datain','stall','数据阶段出错/请求不支持'],
   ['idle','stall','请求不支持（回 STALL）']
  ];
  el.innerHTML='<div class="w-toolbar"><span class="title">EP0 状态机（教学化简）</span><label><input type="checkbox" data-a="err"> 显示异常路径</label><span class="w-note">点击状态查看说明</span></div>'+
   '<div class="w-body"><svg width="100%" viewBox="0 0 720 300" style="display:block"></svg><div class="linfo" data-a="info">点击状态节点。</div></div>';
  var POS={idle:[90,150],datain:[300,60],dataout:[300,240],statin:[540,240],statout:[540,60],stall:[360,150]};
  function draw(showErr){
    var svg=el.querySelector('svg');
    var h='';
    TR.forEach(function(t,i){
      var isErr=t[0]==='datain'&&t[1]==='stall'||t[0]==='idle'&&t[1]==='stall';
      if(isErr&&!showErr) return;
      var a=POS[t[0]], b=POS[t[1]];
      var mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2 + (i%2?10:-10);
      h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="var(--accent-line)" stroke-width="2" '+(isErr?'stroke-dasharray="5 4" stroke="var(--bad)"':'')+'/>';
      h+='<text x="'+mx+'" y="'+my+'" font-size="10.5" fill="var(--muted)" text-anchor="middle">'+t[2]+'</text>';
    });
    Object.keys(POS).forEach(function(k){
      var p=POS[k];
      h+='<g class="node" data-s="'+k+'" style="cursor:pointer"><rect x="'+(p[0]-52)+'" y="'+(p[1]-22)+'" width="104" height="44" rx="10" class="shape" '+(k==='stall'?'stroke="var(--bad)"':'')+'/><text x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" font-size="12">'+ST[k].n+'</text></g>';
    });
    svg.innerHTML=h;
    $all('g.node',svg).forEach(function(g){
      g.addEventListener('click',function(){ var s=ST[g.getAttribute('data-s')]; el.querySelector('[data-a="info"]').innerHTML='<b>'+s.n+'</b><br>'+s.d; });
    });
  }
  el.addEventListener('change',function(ev){ if(ev.target.getAttribute&&ev.target.getAttribute('data-a')==='err') draw(ev.target.checked); });
  draw(false);
};

/* --- U13 Setup 解析器 --- */
WIDGETS['setupParser']=function(el){
  var REQ={0:'GET_STATUS',1:'CLEAR_FEATURE',3:'SET_FEATURE',5:'SET_ADDRESS',6:'GET_DESCRIPTOR',7:'SET_DESCRIPTOR',8:'GET_CONFIGURATION',9:'SET_CONFIGURATION',10:'GET_INTERFACE',11:'SET_INTERFACE',12:'SYNCH_FRAME'};
  var PRESETS={GET_DESCRIPTOR:'8006000100004000',SET_ADDRESS:'0005030000000000',SET_CONFIGURATION:'0009010000000000',GET_STATUS:'8000000000000000',SET_FEATURE:'0003010000000000'};
  el.innerHTML='<div class="w-toolbar"><span class="title">Setup 包解析器</span><select class="ctl" data-a="preset"><option value="">— 选择预设 —</option></select>'+
   '<input class="ctl mono" data-a="hex" style="width:220px" maxlength="16" placeholder="16 个 hex 字符">'+
   '<button class="ctl" data-a="parse">解析</button></div>'+
   '<div class="w-body"><div class="linfo" data-a="out" style="min-height:140px">选择预设或输入 16 个 hex 字符（8 字节，小端字段）。</div></div>';
  var ps=el.querySelector('[data-a="preset"]');
  Object.keys(PRESETS).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=k+'（'+PRESETS[k]+'）'; ps.appendChild(o); });
  function parse(){
    var hx=el.querySelector('[data-a="hex"]').value.trim().toLowerCase();
    var out=el.querySelector('[data-a="out"]');
    if(!/^[0-9a-f]{16}$/.test(hx)){ out.innerHTML='<span style="color:var(--bad)">输入无效：需要恰好 16 个 hex 字符（8 字节）。</span>'; return; }
    var b=[]; for(var i=0;i<8;i++) b.push(parseInt(hx.substr(i*2,2),16));
    var dir=(b[0]&0x80)?'IN（设备→主机）':'OUT（主机→设备）';
    var typ=(b[0]>>5)&3; var typS=['标准','类','厂商','保留'][typ];
    var rcv=b[0]&0x1f; var rcvS=rcv===0?'设备':(rcv===1?'接口':(rcv===2?'端点':'其他'));
    var req=REQ[b[1]]||'（非标准请求码 / 类或厂商请求）';
    var wv=b[2]|(b[3]<<8), wi=b[4]|(b[5]<<8), wl=b[6]|(b[7]<<8);
    var extra='';
    if(b[1]===6){ extra='<br><b>解释：</b>请求描述符：类型='+(wv>>8)+'（1=设备/2=配置…Table 9-5 已核 ✅），索引='+(wv&0xff)+'，主机最多接收 '+wl+' 字节。'; }
    if(b[1]===5){ extra='<br><b>解释：</b>设置设备地址为 '+wv+'（Status 完成后生效，2 ms 恢复）。'; }
    if(b[1]===9){ extra='<br><b>解释：</b>设置配置 '+wv+'；成功后设备进入 Configured 态。'; }
    out.innerHTML='<b>bmRequestType = 0x'+hx.substr(0,2)+'</b>：方向 '+dir+' ｜ 类型 '+typS+' ｜ 接收者 '+rcvS+
     '<br><b>bRequest = 0x'+hx.substr(2,2)+'</b>：'+req+'（Table 9-4 已核 ✅）'+
     '<br><b>wValue = 0x'+hx.substr(4,4)+'</b>（小端='+wv+'）　<b>wIndex = 0x'+hx.substr(8,4)+'</b>（小端='+wi+'）　<b>wLength = 0x'+hx.substr(12,4)+'</b>（小端='+wl+'）'+extra;
  }
  ps.addEventListener('change',function(){ if(PRESETS[ps.value]) el.querySelector('[data-a="hex"]').value=PRESETS[ps.value]; parse(); });
  el.addEventListener('click',function(ev){ if(ev.target.closest('[data-a="parse"]')) parse(); });
};

/* --- U14 微帧调度模拟 --- */
WIDGETS['microframeSim']=function(el){
  el.innerHTML='<div class="w-toolbar"><span class="title">HS 微帧带宽预算模拟（125 µs 时间片）</span>'+
   '<label>同步端点(1024B×3)：<select class="ctl" data-a="iso"><option>0</option><option>1</option><option selected>2</option></select></label>'+
   '<label>中断端点(64B)：<select class="ctl" data-a="intr"><option>0</option><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>'+
   '<label>每微帧轮询次数：<select class="ctl" data-a="n"><option>1</option><option selected>2</option></select></label></div>'+
   '<div class="w-body"><div class="ratebar" style="height:26px"><div class="fill" data-a="fill" style="width:0%"></div><span class="lbl" data-a="pct" style="line-height:26px"></span></div>'+
   '<div class="legend" data-a="lg"></div><div class="callout" data-a="verdict" style="margin-top:10px"></div>'+
   '<p class="w-note">规则依据：高速周期性（同步+中断）≤ 微帧的 80%（§5.9 已核 ✅）；bulk 使用剩余带宽（无保证）。本模型为教学估算：同步按 3×1024 B/微帧计，中断按 wMaxPacketSize×轮询次数计，事务开销未逐项建模。</p></div>';
  function calc(){
    var iso=parseInt($('[data-a="iso"]',el).value,10)||0;
    var intr=parseInt($('[data-a="intr"]',el).value,10)||0;
    var n=parseInt($('[data-a="n"]',el).value,10)||1;
    var periodicBytes=iso*3*1024+intr*64*n;
    var totalBytes=Math.floor(125e-6*60e6); // ≈7500 B（原始速率换算，教学估算）
    var pct=Math.min(100, periodicBytes/totalBytes*100);
    var cap=80;
    $('[data-a="fill"]',el).style.width=pct.toFixed(1)+'%';
    $('[data-a="fill"]',el).style.background=pct>cap?'var(--bad)':'var(--accent)';
    $('[data-a="pct"]',el).textContent='周期性占用 ≈ '+pct.toFixed(1)+'%（上限 80%）';
    $('[data-a="lg"]',el).innerHTML='<span><span class="sw" style="background:var(--accent)"></span>周期性已用</span><span><span class="sw" style="background:var(--chip-bg);border:1px solid var(--border)"></span>控制+bulk 可用</span>';
    var v=$('[data-a="verdict"]',el);
    if(pct>cap){ v.className='callout danger'; v.innerHTML='<b>超出预算：</b>周期性占用 '+pct.toFixed(1)+'% &gt; 80% 上限——主机将在配置阶段<b>拒绝</b>该配置。减少端点数/载荷/轮询次数。'; }
    else { v.className='callout ok'; v.innerHTML='<b>可行：</b>周期性占用 '+pct.toFixed(1)+'%，剩余 '+(100-pct).toFixed(1)+'% 的时间片留给控制与批量传输（bulk 的实际吞吐随剩余空间波动）。'; }
  }
  el.addEventListener('change',calc); calc();
};

/* --- U15 固件架构 --- */
WIDGETS['fwArchitecture']=function(el){
  var M={
